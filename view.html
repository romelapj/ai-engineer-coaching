<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Engineer Coaching · Documento</title>
    <style>
      :root {
        --bg: #0a0a0c;
        --surface: #151518;
        --border: #26262c;
        --text: #ededf0;
        --muted: #a1a1aa;
        --accent: #22d3ee;
        --accent2: #22d3ee;
        --green: #34d399;
        --grad: linear-gradient(120deg, #8b5cf6, #22d3ee);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.65;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 1.4rem;
        background: rgba(10, 10, 12, 0.9);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .topbar a {
        text-decoration: none;
        font-weight: 700;
        font-size: 0.92rem;
      }
      .topbar .back {
        color: var(--accent2);
      }
      .topbar .doc-title {
        color: var(--muted);
        font-size: 0.85rem;
        margin-left: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .topbar .md-link {
        color: var(--accent);
        border: 1px solid var(--border);
        background: rgba(34, 211, 238, 0.1);
        padding: 0.35em 0.9em;
        border-radius: 999px;
        flex-shrink: 0;
      }
      .topbar .md-link:hover {
        border-color: var(--accent);
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 3rem 1.4rem 6rem;
      }
      main h1 {
        font-size: 2.1rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 1rem;
      }
      main h1::after {
        content: "";
        display: block;
        width: 64px;
        height: 4px;
        margin-top: 0.7rem;
        border-radius: 2px;
        background: var(--accent);
      }
      main h2 {
        font-size: 1.5rem;
        margin: 2.4rem 0 1rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid var(--border);
      }
      main h3 {
        font-size: 1.18rem;
        margin: 1.8rem 0 0.6rem;
      }
      main p,
      main li {
        font-size: 1.02rem;
      }
      main a {
        color: var(--accent2);
      }
      main strong {
        color: #fff;
      }
      main code {
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.9em;
        background: rgba(34, 211, 238, 0.12);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.1em 0.4em;
        color: var(--text);
      }
      main pre {
        background: #08080a;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.1rem 1.3rem;
        overflow: auto;
      }
      main pre code {
        background: none;
        border: none;
        padding: 0;
        color: #d4d4d8;
      }
      main blockquote {
        margin: 1.2rem 0;
        padding: 0.7rem 1.3rem;
        border-left: 4px solid var(--accent);
        background: rgba(34, 211, 238, 0.07);
        border-radius: 0 10px 10px 0;
        color: var(--text);
      }
      main table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.2rem 0;
        font-size: 0.95rem;
      }
      main th,
      main td {
        text-align: left;
        padding: 0.6em 0.9em;
        border: 1px solid var(--border);
      }
      main th {
        background: var(--surface);
        color: var(--muted);
        text-transform: uppercase;
        font-size: 0.76rem;
        letter-spacing: 0.06em;
      }
      main details {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.4rem 1.2rem;
        margin: 1rem 0;
      }
      main summary {
        cursor: pointer;
        font-weight: 700;
        padding: 0.6rem 0;
        color: var(--accent2);
      }
      main hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 2.4rem 0;
      }
      main ul.contains-task-list,
      main input[type="checkbox"] {
      }
      main li input[type="checkbox"] {
        margin-right: 0.5em;
      }
      .loading {
        color: var(--muted);
      }
      /* ---------- copiar código ---------- */
      .code-wrap {
        position: relative;
      }
      .slide .code-wrap {
        z-index: 45;
      }
      .copy-btn {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        border: 1px solid var(--border);
        background: rgba(7, 7, 9, 0.85);
        color: var(--muted);
        border-radius: 999px;
        padding: 0.3em 0.85em;
        font-size: 0.76rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        opacity: 0.75;
        transition:
          opacity 0.15s ease,
          border-color 0.15s ease;
      }
      .copy-btn:hover {
        opacity: 1;
        border-color: var(--accent);
      }
      .copy-btn.ok {
        color: var(--green);
        border-color: var(--green);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="back" href="index.html">← Portal</a>
      <a class="md-link" id="mdLink" target="_blank" rel="noopener"
        >Ver markdown en GitHub</a
      >
      <span class="doc-title" id="docTitle"></span>
    </header>
    <main id="content"><p class="loading">Cargando…</p></main>

    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script>
      const REPO = "romelapj/ai-engineer-coaching";
      const params = new URLSearchParams(location.search);
      // Sanitiza: sin slashes iniciales ni traversal.
      let doc = (params.get("doc") || "")
        .replace(/^\/+/, "")
        .replace(/\.\.[\/\\]/g, "");
      const content = document.getElementById("content");
      const back = document.querySelector(".back");
      const mdLink = document.getElementById("mdLink");

      if (doc.startsWith("gym/")) {
        back.href = "gym/index.html";
        back.textContent = "← AI Gym";
      } else {
        back.href = "index.html";
        back.textContent = "← Portal";
      }

      mdLink.href = doc
        ? `https://github.com/${REPO}/blob/main/${doc}`
        : `https://github.com/${REPO}`;
      document.getElementById("docTitle").textContent = doc
        ? doc.split("/").pop()
        : "";

      if (!doc) {
        content.innerHTML =
          "<p>No se especificó documento. Usa <code>?doc=ruta/al/archivo.md</code>.</p>";
      } else {
        fetch(doc)
          .then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
          })
          .then((md) => {
            marked.setOptions({ gfm: true, breaks: false });
            content.innerHTML = marked.parse(md);
            const h1 = content.querySelector("h1");
            if (h1) document.title = "AI Engineer Coaching · " + h1.textContent;
            initCopyButtons(content);
          })
          .catch((e) => {
            content.innerHTML =
              "<p>No se pudo cargar <code>" +
              doc +
              "</code> (" +
              e.message +
              "). Puedes verlo en <a href='" +
              mdLink.href +
              "' target='_blank' rel='noopener'>GitHub</a>.</p>";
          });
      }

      function initCopyButtons(root) {
        function fallbackCopy(text, done) {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          done();
        }
        (root || document).querySelectorAll("pre").forEach((pre) => {
          if (pre.parentElement.classList.contains("code-wrap")) return;
          const wrap = document.createElement("div");
          wrap.className = "code-wrap";
          pre.parentNode.insertBefore(wrap, pre);
          wrap.appendChild(pre);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "copy-btn";
          btn.textContent = "Copiar";
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const code = pre.innerText;
            const ok = () => {
              btn.textContent = "✓ Copiado";
              btn.classList.add("ok");
              setTimeout(() => {
                btn.textContent = "Copiar";
                btn.classList.remove("ok");
              }, 1600);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard
                .writeText(code)
                .then(ok, () => fallbackCopy(code, ok));
            } else {
              fallbackCopy(code, ok);
            }
          });
          wrap.appendChild(btn);
        });
      }
      initCopyButtons();
    </script>
  </body>
</html>
