# Catálogo de videos del curso.
#
# Un video vive aquí una sola vez y lo referencian los días de los talleres con
# `video: {id: <id de YouTube>, porque: "..."}`. Los metadatos (título, autor,
# duración) NO se repiten en el taller: si un video cambia, se corrige aquí.
#
# CÓMO SE LLENA EL CONTENIDO DE LA PÁGINA
#
# Los campos `resumen`, `valioso`, `conecta` y `reparos` son opcionales. Sin
# ellos la página del video se genera igual (con el video embebido y su ficha),
# pero muestra el estado "resumen pendiente" en vez de inventarse el contenido.
#
# No se rellenan a ojo: hay que ver el video. El generador lleva la cuenta de
# cuáles faltan y `build.py --pendientes` los lista.
#
#   resumen : qué dice el video, en orden. 2 a 4 párrafos.
#   valioso : lista de lo que de verdad vale la pena, en frases con contenido
#             (no "explica bien X": qué dice exactamente sobre X).
#   conecta : cómo se enlaza con el día del taller. Aquí va el criterio propio.
#   reparos : dónde se queda corto, qué está desactualizado, en qué discrepas.
#             Un video sin reparos suele ser un video que no se vio con cuidado.

videos:
  # ---------------------------------------------------------------- sesión 01
  wjZofJX0v4M:
    titulo: "But what is a GPT? Visual intro to transformers"
    autor: "3Blue1Brown"
    idioma: "Inglés"
    duracion: "~27 min"
    resumen: |
      Empieza por desarmar la sigla: *generative pre-trained transformer*. Un
      transformer es una red que, dado un texto, devuelve una distribución de
      probabilidad sobre el siguiente trozo; generar texto largo es repetir ese
      paso, muestrear de la distribución y volver a empezar con el resultado
      añadido. Con eso montado, hace el recorrido completo de la tubería: el
      texto se parte en tokens, cada token se convierte en un vector, los
      vectores pasan por bloques de atención donde se hablan entre ellos, luego
      por un perceptrón multicapa donde se procesan en paralelo sin mirarse, y
      esos dos bloques se alternan muchas veces hasta que el último vector
      produce la predicción. Todo lo que ocurre por dentro son matrices de pesos
      que empezaron con valores aleatorios y se ajustaron con datos: en GPT-3,
      175 mil millones de ellos.

      El grueso del video es la primera de esas matrices, la de **embeddings**.
      Tiene una columna por cada token del vocabulario, y esa columna es el
      vector en el que se convierte la palabra. Con los números de GPT-3 son
      50.257 columnas de 12.288 dimensiones: 617 millones de pesos solo para
      entrar. Lo interesante es qué aprende a poner ahí: las **direcciones** del
      espacio acaban cargando significado. La diferencia entre los vectores de
      *woman* y *man* se parece a la que hay entre *queen* y *king*, así que se
      puede buscar la palabra que no conoces sumando esa dirección. Enseña más
      ejemplos —Italia menos Alemania más Hitler cae cerca de Mussolini, sushi
      más la diferencia Alemania‑Japón cae cerca de bratwurst— y es honesto al
      señalar que el caso de *queen* no sale tan limpio como se suele contar.
      De ahí pasa al **producto punto** como medida de alineación entre dos
      vectores, y lo demuestra: la dirección *cats* menos *cat* da valores más
      altos con los plurales que con los singulares, y crecientes con *one*,
      *two*, *three*. Se puede medir cuánta pluralidad ve el modelo en una
      palabra.

      Luego viene la idea que sostiene todo el resto: el vector deja de ser la
      palabra. Sale de la matriz representando solo *king*, pero los bloques de
      la red lo van empujando hasta que apunta a algo mucho más específico —un
      rey que vivió en Escocia, que llegó al puesto asesinando al anterior, y al
      que se describe en lenguaje shakespeariano—. La red solo puede procesar un
      número fijo de vectores a la vez, el tamaño de contexto, que en GPT-3 eran
      2048, y ahí explica por qué las conversaciones largas con los primeros
      ChatGPT daban la sensación de que el bot perdía el hilo.

      Cierra con la salida. Una segunda matriz, la de **desembedding**, lleva el
      último vector a una lista de 50.000 valores, uno por token, y añade otros
      617 millones de parámetros. Esa lista en bruto son los *logits*, y para
      convertirla en probabilidades se aplica **softmax**: se eleva *e* a cada
      número y se divide por la suma. Y dentro de softmax mete la
      **temperatura**, una constante en el denominador del exponente: alta
      reparte peso hacia los valores bajos, baja deja que los altos dominen, y
      en cero siempre sale la palabra más probable. Lo demuestra generando la
      misma historia desde "once upon a time there was a": a temperatura cero
      sale un refrito de Ricitos de Oro; más alta arranca original y degenera en
      incoherencia.
    valioso:
      - >-
        Las direcciones del espacio significan algo: *king* menos *man* más
        *woman* cae cerca de *queen*. Y fíjate en lo honesto que es, porque casi
        nadie lo es con este ejemplo: dice que en su modelo *queen* queda más
        lejos de lo que la cuenta promete, porque esa palabra no se usa como un
        *king* femenino.
      - >-
        El vector deja de ser la palabra. Sale de la matriz siendo solo *king* y
        acaba apuntando a un rey que vivió en Escocia, que llegó al puesto
        asesinando al anterior y al que se describe en lenguaje shakespeariano.
        El contexto no acompaña al vector: lo modifica. Si te quedas con una
        imagen del video, que sea esa.
      - >-
        La temperatura, explicada por dentro: una constante en el denominador
        del exponente de softmax. Cuando en la sesión 02 subas ese número al
        llamar a la API, vas a saber qué estás moviendo y no solo que "da
        respuestas más creativas".
    conecta: >-
      Ya sabes que arranca donde termina el día de hoy. Pero lo que de verdad
      quiero que veas es otra cosa, y es que este video es la sesión 04 sin
      nombrarla. Los embeddings y el producto punto que explica aquí son,
      literalmente, lo que vas a construir cuando lleguemos al RAG: el retriever
      no hace nada más exótico que convertir texto en vectores y medir cuáles
      apuntan en la misma dirección. Si hoy te llevas el dibujo, dentro de
      cuatro sesiones no vas a estar aprendiendo RAG. Vas a estar implementando
      algo que ya viste.
    reparos: >-
      Una cosa te tengo que avisar antes de que le des a reproducir. En el
      minuto 12:44 anuncia que va a fingir que el texto se parte en palabras
      limpias, "porque los humanos pensamos en palabras". Para lo que él quiere
      explicar es una licencia razonable, y es exactamente lo contrario de lo
      que acabas de comprobar hoy con tus propios ojos: el modelo no ve
      palabras. Míralo traduciendo sobre la marcha: cada vez que él diga
      "palabra", ahí hay un token. El resto del video se sostiene igual.

  Sz4qacFBHLk:
    titulo: "¿Qué es un LLM? Enormes Modelos del Lenguaje"
    autor: "Dot CSV"
    idioma: "Español"
    duracion: "~15 min"
    resumen: |
      Cuenta veinte años del campo resolviendo **el mismo problema cuatro
      veces**: dado el texto de un tuit, decir si el sentimiento es positivo o
      negativo. Ese hilo es todo el video, y funciona porque cada vez que
      cambia la técnica se ve exactamente qué deja de hacer falta.

      Primero, principios de los 2000: diccionarios de polaridad. Se puntúan
      palabras buenas y malas y se suma. Lo enseña en código y lo rompe en el
      mismo minuto con una frase irónica —"me encantaría ir a este restaurante
      si quiero tirar el dinero"— que la librería clasifica como positiva.
      Luego 2012 y las redes recurrentes: funcionan mejor, pero son aprendizaje
      **supervisado**, así que exigen un dataset donde alguien se sentó a
      etiquetar a mano. Y ahí está el detalle que importa: si cambias la tarea
      de positivo/negativo a una nota de 1 a 5 estrellas, no ajustas nada,
      vuelves a etiquetar el dataset entero y vuelves a entrenar desde cero.

      El giro llega en 2017, con dos cosas a la vez. Una es una idea prestada de
      la visión por ordenador, donde ya se partía de un modelo **preentrenado**
      y se reajustaba con muchos menos datos; la otra son los transformers. Se
      empieza a entrenar modelos para que aprendan el lenguaje en sí, con
      ejercicios tontos repetidos millones de veces: tapar una palabra y
      adivinarla, o continuar una frase. Y aquí está el cambio de fondo, que él
      subraya: la etiqueta ya no la pone un humano, sale del propio texto. Se
      pasa de aprendizaje supervisado a **autosupervisado**, el etiquetado deja
      de ser el cuello de botella, y los datos de entrenamiento crecen en
      órdenes de magnitud. De paso enseña Hugging Face y monta un análisis de
      sentimientos con un `pipeline` de la librería `transformers`, sin entrenar
      nada.

      Cierra con 2020 y GPT-3: 175 mil millones de parámetros, 117 veces más
      grande que GPT-2. Lo entrenaron solo para autocompletar, y resultó que al
      escalarlo aprendió cosas que nadie le pidió: traduce al inglés o al chino,
      escribe Python, funciona como chatbot si le das el formato de diálogo. La
      demo final es la que redondea el video: vuelve al problema del principio y
      lo resuelve con GPT-3 escribiendo un ejemplo en el prompt. Luego lo cambia
      a estrellas de 1 a 5 sin reentrenar nada, y después a un clasificador de
      *Harry Potter* contra *El Señor de los Anillos*, con el mismo truco. Avisa
      de que para producción lo correcto seguiría siendo reentrenar con datos
      etiquetados, y termina anunciando PaLM, cuatro veces mayor que GPT-3.
    valioso:
      - >-
        El desbloqueo no fue el transformer: fue que la etiqueta empezó a salir
        del propio texto. Tapar una palabra y adivinarla no necesita a nadie
        sentado etiquetando, y ahí desaparece el cuello de botella que limitaba
        todo lo anterior. Si alguna vez te preguntan por qué los modelos
        pudieron crecer tanto, la respuesta está en ese minuto y no en la
        arquitectura.
      - >-
        Nadie le enseñó a traducir. A GPT-3 lo entrenaron solo para
        autocompletar texto, y salió traduciendo al inglés y al chino,
        escribiendo Python y haciendo de chatbot si le dabas el formato de
        diálogo. Cuenta las capacidades emergentes con ejemplos que puedes
        reproducir y sin una gota de misticismo, que es más raro de lo que
        parece en este tema.
    conecta: >-
      La demo del final —escribe un ejemplo dentro del prompt y el modelo hace
      la tarea— es la sesión 02 sin nombrarla. Hoy lo vas a ver como un truco de
      magia, y está bien que sea así: míralo como el tráiler. La semana que
      viene lo hacemos despacio y con las manos, y entonces vas a entender por
      qué ese ejemplo que él escribe casi de pasada es la mitad del trabajo.
    reparos: >-
      Se pasa cuatro minutos enseñándote a resolver el problema con un prompt, y
      diez segundos al final avisando de que para producción lo correcto sería
      reentrenar el modelo con datos etiquetados. El aviso es acertado, pero
      llega tarde y en voz baja, y lo que queda en la cabeza es la demo. Que
      quede claro por si acaso: si sales del video pensando que un prompt
      ingenioso sustituye a un dataset, te llevaste justo lo contrario de lo que
      él dice. Esa confusión sale cara, y es la razón de que la sesión 08 sea
      entera de evals: "funciona en los tres ejemplos que probé" no es una
      medida de nada.

