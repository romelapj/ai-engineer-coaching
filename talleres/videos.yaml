  # ---------------------------------------------------------------- sesión 04
  8OJC21T2SL4:
    titulo: "The 5 Levels Of Text Splitting For Retrieval"
    autor: "Greg Kamradt"
    idioma: "Inglés"
    duracion: "~1 h 10 min"
    resumen: |
      Greg Kamradt organiza el chunking en cinco niveles que van de lo mecánico
      a lo semántico, y arranca con una regla que repite tres veces a lo largo
      de la hora: **el objetivo no es trocear por trocear, es dejar los datos en
      un formato del que se pueda recuperar valor después**. Su reformulación de
      la pregunta vale por sí sola: no preguntes "¿cómo troceo mis datos?", sino
      "¿cuál es la forma óptima de pasarle a mi modelo los datos que necesita
      para mi tarea?". La justificación es doble: el modelo tiene un límite de
      contexto, y rinde mejor cuando sube la relación señal/ruido. Cita a Anton,
      cofundador de Chroma: la información que distrae dentro de la ventana de
      contexto degrada de forma medible el rendimiento de toda la aplicación.

      **Nivel 1, corte por caracteres.** Trocear cada N caracteres, con un
      solape opcional. Lo enseña a mano para que se vea el fallo: con 35
      caracteres, la palabra "chunk" queda partida en "CH" y "unk". Su veredicto
      es directo: no conoce a nadie que use esto en producción. Aquí introduce
      `chunk_size` y `chunk_overlap`, y de paso su herramienta
      [chunkviz.com](https://chunkviz.com), que colorea los chunks en vivo
      mientras mueves el tamaño.

      **Nivel 2, corte recursivo.** En vez de un número fijo, una lista de
      separadores que se prueban en orden: primero doble salto de línea
      (párrafos), luego salto de línea, luego espacios, luego caracteres. La
      idea de fondo es que aprovecha cómo escriben los humanos, que separan sus
      ideas en párrafos. Con 65 caracteres todavía corta a mitad de frase; al
      subir a 450 empieza a respetar los párrafos completos. Es el nivel que él
      recomienda como punto de partida de cualquier proyecto.

      **Nivel 3, corte por tipo de documento.** Si el documento trae estructura,
      úsala: encabezados en Markdown, `class` y `def` en Python, la sintaxis de
      JavaScript. La parte más útil es la de PDFs: extrae las tablas como
      **HTML**, porque el modelo entiende HTML y Markdown mucho mejor que una
      tabla maquetada visualmente. Y para las imágenes propone algo que no es
      obvio: como los espacios vectoriales de texto e imagen no coinciden,
      genera con un modelo de visión un **resumen en texto de cada imagen**,
      indexa ese resumen, y en la recuperación devuelve el resumen o le pasa la
      imagen a un modelo multimodal.

      **Nivel 4, corte semántico.** Aquí está su mejor observación: los tres
      primeros niveles solo miran la posición física del texto. Es como ordenar
      una biblioteca por el tamaño de los libros y el hueco del estante, en vez
      de por lo que tratan. Su método: partir en frases, agrupar cada frase con
      la anterior y la siguiente para reducir ruido, embeber cada grupo y medir
      la distancia entre grupos consecutivos. Donde la distancia se dispara, hay
      un cambio de tema y por tanto un corte. Usa el percentil 95 de las
      distancias como umbral y le salen 17 chunks del ensayo de Paul Graham.

      **Nivel 5, corte agéntico.** Parte de preguntarse cómo lo haría una
      persona: empezar por arriba, meter lo primero en un chunk, e ir bajando
      decidiendo si cada pieza nueva pertenece a un chunk que ya existe o abre
      uno nuevo. Para que el modelo pueda decidir, primero convierte el texto en
      **proposiciones**, frases que se sostienen solas: *"Greg fue al parque. Le
      gusta caminar"* se convierte en *"Greg fue al parque. A Greg le gusta
      caminar"*. Se lee peor y se recupera mejor. Cada chunk lleva un título y
      un resumen que **se reescriben** cuando entra una proposición nueva, y en
      la demo se ve a un chunk cambiar de nombre al crecer.

      **Nivel extra, representaciones alternativas.** Cierra saliéndose del
      chunking: indexar un resumen del texto en vez del texto, indexar preguntas
      hipotéticas que alguien haría, buscar con el chunk pequeño pero entregar
      el documento padre, o extraer un grafo de entidades en vez de trocear.
    valioso:
      - |
        **El mandamiento del chunking**: el objetivo no es trocear, es dejar los
        datos listos para que se pueda recuperar valor de ellos. Si tu estrategia
        no sirve a la tarea de después, da igual lo sofisticada que sea.
      - |
        **El nivel 2 es el que mejor paga.** Es una línea de código, no necesita
        procesamiento extra y aprovecha que la gente separa sus ideas en
        párrafos. Empezar por ahí y complicarse solo si los números lo piden.
      - |
        **Las tablas de un PDF se entregan como HTML, no como texto plano.** El
        modelo fue entrenado con tablas HTML y Markdown; una tabla maquetada
        visualmente pierde la relación entre celda y encabezado al aplanarse.
      - |
        **Las imágenes se indexan por su resumen en texto.** Los embeddings de
        imagen y los de texto viven en espacios distintos, así que buscar entre
        los dos no funciona bien. Convertir la imagen en texto la mete en el
        mismo espacio que el resto del corpus.
      - |
        **La analogía de la biblioteca** para explicar por qué el corte físico
        se queda corto: ordenar los libros por su tamaño y el hueco del estante
        en vez de por lo que tratan.
      - |
        **Las proposiciones del nivel 5**: un texto óptimo para recuperar no es
        un texto agradable de leer. Resolver los pronombres ("él" a "Greg")
        empeora la prosa y mejora la recuperación.
      - |
        La honestidad de fondo: dice de entrada que **no va a prescribir el
        mejor método** porque no existe, y enseña por qué. Ese encuadre vale más
        que cualquiera de las cinco técnicas.
    conecta: |
      **Lo que hiciste hoy es su nivel 3, no el 1 ni el 2.** Tu `chunk_markdown`
      corta por los títulos `##` y `###`, que es exactamente el caso de Markdown
      que él muestra: usar la estructura que el documento ya trae en vez de un
      número de caracteres. Vale la pena ver los niveles 1 y 2 sabiendo eso,
      porque explican de qué te libraste.

      Hay un detalle donde el taller va un paso más allá que el video. Él corta
      por encabezado; nosotros además construimos el id `archivo § sección` con
      ese encabezado, y ese id es el que hace posible el golden set de la sesión
      05. El video se queda en producir los chunks; el taller los produce
      **identificables**, que es lo que después permite medir.

      Su nivel 4 y su nivel extra no son curiosidades: son literalmente el
      contenido del día 9 del taller 05. El corte semántico es primo del
      contextual retrieval, y su "busca con el chunk pequeño y entrega el padre"
      es la palanca D, parent-document, tal cual.

      Y el momento que más conviene retener es cuando dice que no hay una forma
      correcta y que hay que evaluar. Ahí remite a una herramienta externa y
      sigue adelante. Ese hueco exacto es la sesión 05 completa: recall@k, MRR y
      un golden set con el que esa pregunta deja de ser de opinión.
    reparos: |
      **El video no mide nada, y él lo dice.** Enseña cinco estrategias y declara
      de entrada que su objetivo no es prescribir la mejor. Como exposición está
      muy bien, pero te deja con cinco opciones y sin criterio para elegir entre
      ellas. Cuando menciona las evaluaciones las despacha como "más un tema de
      retrieval" y remite a otra herramienta. Míralo sabiendo que la parte que
      falta es la que más te va a costar en tu proyecto.

      **El percentil 95 del nivel 4 es un número puesto a ojo**, y él lo admite
      ("hay un millón de formas de hacer esto"). No es un defecto del método,
      pero sí una perilla más que alguien tendrá que calibrar, y calibrar sin
      golden set es adivinar.

      **El nivel 5 es lento y caro**, y en la propia demo solo procesa cinco
      párrafos. Su apuesta es que los modelos se abaraten. Razonable, pero hoy
      sigue siendo una llamada al modelo por cada proposición y por cada
      actualización de título y resumen.

      **La parte de imágenes está fechada.** Descarta CLIP diciendo que la
      tecnología "todavía no está ahí" y avisa de que eso puede cambiar. El
      video es de 2024: si vas a trabajar con material visual, esa sección hay
      que revisarla contra los modelos multimodales de hoy antes de copiarla.

      **Casi todo va sobre LangChain y LlamaIndex.** El curso lo hace a mano a
      propósito, para que cada pieza se entienda por dentro. No es una
      contradicción, pero cuando veas su código de una línea, recuerda que tú ya
      sabes qué hay debajo.

  dN0lsF2cvm4:
    titulo: "Vector Databases simply explained! (Embeddings & Indexes)"
    autor: "Python Engineer"
    idioma: "Inglés"
    duracion: "~4 min"
    resumen: |
      Cuatro minutos, y la frase más útil está en los primeros veinte segundos:
      las bases de datos vectoriales levantaron cientos de millones y se las
      llamó "un nuevo tipo de base de datos para la era de la IA", pero **para
      muchos proyectos son excesivas, y una base de datos tradicional o incluso
      un simple array de numpy funcionan perfectamente**. Que eso lo diga un
      video divulgativo sobre bases vectoriales, en la apertura, dice bastante a
      su favor.

      **El problema.** La mayor parte de los datos no tienen estructura: posts,
      imágenes, audio, video. No encajan bien en una tabla relacional. Su
      ejemplo es claro: para buscar imágenes parecidas en una base relacional
      terminas asignando etiquetas a mano, porque desde los valores de los
      píxeles no se puede buscar por parecido. O etiquetas a mano, o encuentras
      **otra representación** del dato. Esa segunda salida es el embedding.

      **La definición, en dos piezas.** Una base vectorial *indexa y almacena*
      embeddings para búsqueda rápida por similitud. Y esas dos piezas son
      distintas:

      Primero, el **embedding**: una lista de números que representa el dato de
      otra forma, calculada por un modelo de machine learning. Puede ser de una
      palabra, de una frase entera o de una imagen. Una vez el dato es numérico,
      encontrar elementos parecidos es medir distancias y buscar los vecinos más
      cercanos. Avisa de que dibuja el ejemplo en dos dimensiones por comodidad,
      pero que en la práctica son cientos.

      Segundo, el **índice**, que es la parte que casi nadie menciona: guardar
      los embeddings no basta. Recorrer miles de vectores calculando distancias
      una por una sería demasiado lento, así que hay que mapear los vectores a
      una estructura de datos que acelere la búsqueda. Reconoce que es un campo
      de investigación en sí mismo y que existen varias formas de construir esos
      índices, y ahí lo deja.

      **Para qué sirve.** Memoria de largo plazo para modelos de lenguaje,
      búsqueda semántica (por significado, no por coincidencia exacta de
      cadenas), búsqueda por parecido en imágenes, audio y video, y motores de
      recomendación: sugerir artículos parecidos a compras anteriores es
      exactamente buscar los vecinos más cercanos de un artículo.

      Cierra enumerando opciones: Pinecone, Weaviate, Chroma, Redis, Qdrant,
      Milvus y Vespa.
    valioso:
      - |
        **La advertencia de apertura**: una base vectorial puede ser excesiva, y
        un array de numpy puede bastar. Con los 23 chunks del taller, ese es
        literalmente tu caso; usas Chroma para aprender la mecánica, no porque
        el volumen lo exija.
      - |
        **La separación entre embedding e índice.** Mucha gente conoce solo la
        primera mitad y cree que una base vectorial es "donde guardo los
        embeddings". El índice es lo que la convierte en una base de datos y no
        en una lista.
      - |
        **Guardar no es buscar.** Comparar contra todos los vectores uno por uno
        es correcto y demasiado lento; el índice existe para no hacer eso.
      - |
        El recordatorio de que **el dibujo en dos dimensiones es una mentira
        piadosa**: los vectores reales tienen cientos de dimensiones, donde la
        intuición geométrica deja de servir.
      - |
        **Recomendar y buscar son la misma operación.** "Artículos parecidos a
        tu última compra" y "chunks parecidos a esta pregunta" son la misma
        consulta de vecinos más cercanos con distinto nombre comercial.
    conecta: |
      Las dos piezas que el video separa son las dos decisiones del día de hoy,
      y en `crear_coleccion()` ocupan una línea cada una.

      La primera es el **embedder**: Chroma trae uno por defecto y por eso no lo
      ves escrito, pero está ahí calculando el vector de cada chunk. Es el paso
      que el video llama "un modelo de machine learning calcula la lista de
      números".

      La segunda es el **índice**, y aquí el taller dice algo que el video se
      guarda: `metadata={"hnsw:space": "cosine"}`. HNSW es precisamente una de
      esas "distintas formas de calcular índices" que él menciona sin nombrar, y
      `cosine` es la métrica de distancia. Esa línea no es decoración: es la que
      hace que la fórmula `similitud = 1 - distancia` de `rag.py` signifique
      algo. Sin ella Chroma indexa con L2 y el umbral de 0.40 pasa a ser un
      número arbitrario.

      Dicho de otro modo: el video te da el mapa conceptual y el taller te
      enseña dónde caen las dos coordenadas en tu propio código.
    reparos: |
      **Se calla el trade-off más importante de los índices: son aproximados.**
      Dice que los índices hacen falta para buscar de forma eficiente, y ahí lo
      deja. Lo que no dice es qué se paga a cambio: HNSW y compañía son
      algoritmos de vecinos cercanos *aproximados*, y pueden no devolverte el
      vecino verdadero. Cambias exactitud por velocidad. Esa omisión importa
      porque es justo lo que se mide en la sesión 05 con recall@k.

      **No menciona la metadata ni el filtrado**, que en un sistema real es la
      mitad del trabajo. Filtrar por año, por tipo de documento o por permisos
      de usuario antes de buscar suele mover más la aguja que cambiar de
      embedder, y es la palanca B del día 9 de la sesión 05.

      **Su mejor idea se queda sin desarrollar.** Abre diciendo que una base
      vectorial puede ser excesiva y que un array de numpy puede bastar, y luego
      nunca vuelve a eso: no da ningún criterio de cuándo sí y cuándo no. La
      regla práctica que falta es sencilla: por debajo de unos pocos miles de
      vectores, la fuerza bruta con numpy es más rápida de escribir, más fácil
      de depurar y suficientemente veloz.

      **El dato del "más del 80% de los datos no están estructurados"** circula
      por todas partes sin una fuente sólida detrás. Es plausible y es
      irrelevante para tu decisión: lo que importa es si *tus* datos lo están.

      **La lista de opciones está fechada** (el video es de 2023). Falta
      `pgvector`, que hoy es la respuesta por defecto para mucha gente,
      precisamente porque evita añadir una base de datos nueva a tu
      infraestructura.

  T-D1OfcDW1M:
    titulo: "What is Retrieval-Augmented Generation (RAG)?"
    autor: "IBM Technology"
    idioma: "Inglés"
    duracion: "~6 min"
    resumen: |
      Marina Danilevsky, investigadora senior de IBM Research, explica RAG en
      seis minutos partiendo de una anécdota doméstica que funciona mejor que
      cualquier diagrama. Sus hijos le preguntan qué planeta del sistema solar
      tiene más lunas, y ella responde con seguridad: Júpiter, 88 lunas, porque
      leyó un artículo. Hace treinta años de aquello.

      **Su respuesta tiene dos defectos, y son exactamente los dos de un modelo
      de lenguaje.** El primero es que **no cita ninguna fuente**: dijo con
      aplomo "leí un artículo", pero respondió de memoria. El segundo es que
      **está desactualizada**. Si hubiera parado un momento a mirar una fuente
      fiable como la NASA, habría dicho Saturno con 146 lunas, y de paso, bromea,
      no habría revelado cuánto hace que le interesa el espacio.

      **Qué añade la parte de "retrieval-augmented".** En vez de depender solo de
      lo que el modelo aprendió, se añade un *almacén de contenido*, que puede
      ser abierto como internet o cerrado como una colección de documentos o de
      políticas internas. Antes de responder, se recupera de ahí lo relevante a
      la pregunta. La respuesta deja de ser Júpiter y pasa a ser Saturno.

      **El prompt pasa a tener tres partes**: la instrucción de a qué prestar
      atención, el contenido recuperado y la pregunta del usuario. Con eso el
      modelo puede además dar evidencia de por qué respondió lo que respondió.

      **Cómo ataca cada defecto.** Contra la desactualización: ya no hay que
      reentrenar el modelo cuando aparece información nueva, basta con
      actualizar el almacén. Contra la falta de fuente: el modelo recibe la
      instrucción de atender a datos primarios antes de responder y de citarlos,
      lo que lo hace menos propenso a alucinar porque depende menos de lo que
      memorizó. Y habilita un comportamiento que ella presenta como deseable y
      no como fallo: **saber decir "no lo sé"** cuando la pregunta no se puede
      responder de forma fiable con los datos disponibles, en vez de inventar
      algo creíble que despiste al usuario.

      **Y reconoce el precio**, en una frase que conviene no pasar por alto: si
      el recuperador no es lo bastante bueno para darle al modelo el mejor
      material, una pregunta que **sí** era respondible se queda sin respuesta.
      Por eso, dice, en IBM trabajan el problema por los dos lados, el
      recuperador y el generador.
    valioso:
      - |
        **La anécdota de las lunas** deja los dos fallos en un ejemplo que
        entiende cualquiera: respondió sin fuente y respondió desactualizada. Es
        la mejor forma que conozco de explicarle RAG a alguien que no programa.
      - |
        **La respuesta correcta cambia con el tiempo** (Júpiter, luego Saturno, y
        seguirá cambiando según se descubran lunas). Es el mejor argumento a
        favor de RAG frente a reentrenar: actualizas el almacén, no el modelo.
      - |
        **El prompt de tres partes**: instrucción, contenido recuperado y
        pregunta. Esa es toda la arquitectura del paso de generación.
      - |
        **"No lo sé" es un resultado deseable, no un fallo.** Es una postura, y
        es la que hace que un sistema RAG sea auditable en vez de simplemente
        convincente.
      - |
        **La frase más valiosa del video, y casi la última**: un recuperador
        mediocre convierte preguntas respondibles en "no lo sé". Es el reverso
        exacto de la ventaja, y casi nadie lo menciona en una intro.
    conecta: |
      Las dos ventajas que ella nombra son literalmente las dos que hoy
      programaste. Los datos frescos son tu `docs/` reindexable, y las fuentes
      citables son el marcador `[n]` con su `(fuente § sección)`.

      Su prompt de tres partes es tu función `generar()` línea por línea:
      `SYSTEM_GENERACION` es la instrucción, el contexto numerado es el
      contenido recuperado y la pregunta del usuario va al final. Cuando veas su
      diagrama, reconócelo, porque es el código que acabas de escribir.

      Y el "saber decir no lo sé" es el día de hoy con nombre y apellido: tu
      `UMBRAL = 0.40` y el corto-circuito que devuelve *"No tengo evidencia para
      responder"* sin llegar a llamar al modelo. Ella lo plantea como una virtud
      del sistema; tú lo tienes implementado en cuatro líneas.

      Ahora la parte que más te va a servir. Guarda esa frase suya sobre el
      recuperador mediocre, porque **es el punto de partida entero de la sesión
      05**. Ella lo enuncia como advertencia teórica en una frase; el taller 05
      lo reproduce con números en su día 3: el chunk correcto para la pregunta
      de `sk_test_` sí se recuperó, quedó de cuarto con similitud 0.387, y el
      umbral lo cortó por trece milésimas mientras dejaba pasar dos chunks
      irrelevantes. Eso es su advertencia, medida.
    reparos: |
      **No dice cómo se recupera, y ahí está todo el trabajo.** "El modelo habla
      con el almacén de contenido y pide lo relevante" es una caja negra del
      tamaño de dos sesiones del curso: chunking, embeddings, top-k, umbral,
      búsqueda léxica, reordenamiento. La palabra "relevante" es justamente la
      que esconde el problema.

      **Difumina quién decide buscar.** Su diagrama sugiere que el modelo va y
      consulta el almacén por iniciativa propia. En un pipeline RAG como el de
      esta sesión, quien busca es **tu código**, siempre, antes de llamar al
      modelo; el modelo solo recibe el contexto ya recuperado. Que el modelo
      decida si buscar y qué buscar es otra cosa, y es la sesión 06. Vale la
      pena tener clara esa frontera desde ahora.

      **No hay una sola métrica en todo el video.** Es una introducción de seis
      minutos y sería injusto exigírselo, pero conviene salir sabiendo que
      "mejorar el recuperador", que ella menciona de pasada, no tiene sentido
      hasta que puedas medirlo.

      **Dice que RAG hace menos probable filtrar datos, y eso solo es media
      verdad.** Es cierto que el modelo depende menos de lo que memorizó en el
      entrenamiento. Pero el almacén de contenido introduce un riesgo nuevo que
      el video no menciona: si ahí dentro hay documentos que este usuario no
      debería ver, tu RAG se los va a servir con una cita bien formateada. El
      control de acceso en la recuperación es un problema real y no aparece.

  uAsd9pOIcLg:
    titulo: "¿Qué es RAG? Clase con código y ejemplo"
    autor: "EvoAcademy"
    idioma: "Español"
    duracion: "~38 min"
    resumen: |
      Una clase en español que construye un RAG completo en Google Colab, de
      principio a fin. Arranca con tres preguntas a ChatGPT que fallan **por
      motivos distintos**, y esa separación es lo mejor de la primera parte:
      preguntar qué es su propia academia produce una respuesta que empieza bien
      y se desvía sola hacia biología evolutiva (alucinación); preguntar quién
      preside Argentina devuelve a Alberto Fernández "según mi última
      actualización de octubre de 2023" (desactualización); y preguntar dónde se
      transmitirá la WWE en 2025 devuelve la situación vieja porque la noticia es
      posterior a su entrenamiento.

      Su argumento contra reentrenar es más completo que el habitual: además de
      costar una fortuna en cómputo, **el reentrenamiento puede seguir sin
      incluir tus datos**, porque tus documentos internos no van a estar en el
      corpus de nadie.

      **Por qué se parte en trozos**, con dos razones separadas. La primera es de
      relevancia: en una noticia larga que cuenta qué pasó, dónde y por qué,
      puede que al usuario solo le importe el dónde, y trocear permite quedarse
      con esa parte. La segunda es técnica: la ventana de contexto es limitada.

      **Embeddings.** Su explicación es la clásica y está bien contada: la
      palabra "rey" descompuesta en sus letras no dice nada de su significado,
      pero como vector queda más cerca de "reina" que de "manzana", y las
      parejas hombre/mujer y rey/reina aparecen paralelas en el espacio. De ahí
      la aritmética famosa: rey menos hombre más mujer da reina. Avisa varias
      veces de que es una simplificación.

      **La demo.** Carga dos noticias, la del traslado de la WWE a Netflix y otra
      completamente distinta sobre un empresario chileno, esta última a propósito
      para que el sistema tenga que **discriminar** y el ejercicio no sea
      tramposo. Parte con `RecursiveCharacterTextSplitter` y le salen 14 trozos.
      Calcula los embeddings con OpenAI y los guarda en un DataFrame de pandas,
      "como si fuera un Excel", diciendo con todas las letras que eso sirve para
      14 trozos y no para miles. Para buscar usa el producto punto, recupera **un
      solo trozo** y se lo pasa al modelo con un prompt de texto de referencia.
      La respuesta sale correcta y la segunda noticia no aparece por ningún lado.

      Cierra con un mapa de cómo se sofistica cada etapa: otras técnicas de
      troceo, modelos de embeddings especializados por industria (menciona el
      caso del tabulador en código, un carácter invisible con significado),
      intervenir la pregunta del usuario antes de buscar, y un reranker externo
      que reordene 10 o 20 candidatos "añadiendo complejidad y latencia, pero
      también precisión".
    valioso:
      - |
        **Tres fallos distintos, no uno.** Alucinar, estar desactualizado y no
        conocer una noticia reciente se parecen desde fuera y se arreglan
        distinto. Separarlos desde el minuto uno es didáctica de la buena.
      - |
        **Reentrenar no resuelve el problema aunque te sobre el dinero**, porque
        tus documentos internos no están en el corpus de entrenamiento de nadie.
        Es el argumento a favor de RAG que menos se escucha y el más definitivo.
      - |
        **Nombra el supuesto clave en voz alta**: se asume que lo más parecido es
        lo más relevante, y dice explícitamente que ese supuesto lo hacen todas
        las bases vectoriales y todas las implementaciones de retrieval. Casi
        nadie lo enuncia; es exactamente la premisa que la sesión 05 rompe.
      - |
        **El modelo de embeddings puede ser distinto del de generación.** Todo el
        retrieval se apoya en el primero y puede vivir en otro proveedor. Es una
        separación de responsabilidades que mucha gente no ve hasta que le toca
        cambiar uno de los dos.
      - |
        **Carga una segunda noticia irrelevante a propósito** para que el sistema
        tenga que descartarla. Es un reflejo sano: un ejemplo donde solo existe
        la respuesta correcta no demuestra nada.
      - |
        **El mapa final de sofisticaciones** es, sin que él lo sepa, el índice de
        la sesión 05: reescribir la consulta, embeddings especializados y un
        reranker externo con su coste en latencia.
    conecta: |
      Es el mismo pipeline que acabas de terminar, montado por otra persona y con
      otras herramientas. Verlo así, completo y de corrido, ayuda a comprobar que
      ya reconoces cada pieza: sus tres macroprocesos (indexación, recuperación,
      generación) son tus tres archivos.

      Vale la pena fijarse en **las decisiones donde el taller eligió distinto**,
      porque ninguna es casual:

      Él guarda los vectores en un DataFrame de pandas y avisa de que con miles
      de trozos no aguanta; tú usaste Chroma desde el principio para no tener que
      reescribirlo después. Él compara con producto punto; tú fijaste coseno de
      forma explícita al crear la colección. Con los embeddings de OpenAI, que
      vienen normalizados, ambas medidas coinciden, pero el producto punto sin
      normalizar favorece a los vectores de mayor magnitud, así que la
      equivalencia depende del modelo y conviene no darla por hecha.

      Y la diferencia que de verdad importa hoy: **él recupera exactamente un
      trozo, sin umbral, y su prompt no pide citas ni contempla la posibilidad de
      no saber**. Tu `v0.3` hace las tres cosas que le faltan: recupera cuatro
      candidatos, corta por `UMBRAL`, y obliga al modelo a citar `[n]` o a
      responder que no tiene evidencia. Compara su prompt de "texto de
      referencia" con tu `SYSTEM_GENERACION` y verás que la distancia entre una
      demo y algo auditable son tres reglas.
    reparos: |
      **Su RAG no puede decir que no sabe.** Recupera siempre un trozo, porque
      siempre existe un "más parecido" aunque sea basura, y el prompt no le da al
      modelo la opción de responder que la información no está. Si le preguntas
      algo que no está en las dos noticias, contestará igual, con lo que sepa de
      su entrenamiento y sin avisar. Es justo el fallo que tu día de hoy cierra
      con el umbral y la frase de rendición.

      **Tampoco pide citas.** La respuesta final es correcta, pero no hay forma
      de saber de dónde salió cada afirmación sin ir a leer el trozo a mano. Con
      dos noticias se puede; con dos mil documentos, no.

      **El ejemplo está diseñado para salir bien.** Las dos noticias que carga no
      se parecen en nada, así que discriminar entre ellas es fácil. Él lo
      reconoce a medias al decir que añadió la segunda "para no hacerle tan fácil
      la vida", pero dos documentos disjuntos no son una prueba: el caso difícil
      es cuando los documentos hablan de lo mismo y solo uno responde, que es el
      corpus con el que trabaja este taller.

      **No mide nada.** La validación es leer la respuesta y decir "sí es
      correcta". Con una pregunta y catorce trozos se puede; es exactamente el
      método que deja de funcionar en cuanto el corpus crece, y el motivo de que
      exista la sesión 05.

      **Se le cruzan las dimensiones**: dice 1536 (que es lo correcto para los
      embeddings de OpenAI que usa) y poco después menciona 100. Es un lapsus, no
      un error de fondo, pero si estás tomando notas puede despistar.

      **Contiene promoción de su curso corporativo** hacia el final. Es legítimo
      y conviene saberlo antes de llegar ahí.

  sVcwVQRHIc8:
    titulo: "Learn RAG From Scratch: Python AI Tutorial"
    autor: "freeCodeCamp.org · Lance Martin (LangChain)"
    idioma: "Inglés"
    duracion: "~2 h 33 min"
    resumen: |
      Un curso entero, no un video. Lance Martin, ingeniero de LangChain,
      recorre catorce técnicas de RAG en dos horas y media. No se ve de una
      sentada: se usa como catálogo al que volver cuando tengas un síntoma
      concreto. La última media hora, en cambio, sí conviene verla entera y de
      corrido, porque es lo mejor de todo.

      **La estructura del RAG avanzado, tal como él la ordena.** Traducción de la
      consulta (reescribirla antes de buscar), enrutamiento (mandarla a la fuente
      correcta), construcción de la consulta (pasar de lenguaje natural al
      lenguaje de la base de datos), indexación, y razonamiento sobre lo
      recuperado y lo generado. Ese índice es, sin exagerar, el temario de las
      sesiones 05 y 06 de este curso.

      **Traducción de la consulta.** Multi-query reescribe la pregunta en varias
      versiones desde distintos ángulos y recupera con todas, porque la redacción
      original puede caer lejos del documento correcto en el espacio de
      embeddings. RAG Fusion añade **Reciprocal Rank Fusion** para consolidar
      esas listas. La descomposición parte la pregunta en subpreguntas y las
      resuelve encadenando respuestas. Step-back hace lo contrario, generar una
      pregunta **más abstracta** y recuperar con las dos. Y HyDE parte de una
      observación fina: preguntas y documentos son objetos de texto muy distintos
      (uno corto y mal redactado, otro largo y denso), así que genera un
      documento hipotético a partir de la pregunta y busca con él.

      **Indexación.** Distingue los vectores dispersos, estadísticos y basados en
      frecuencia de palabras, de los embeddings aprendidos. Multi-representation
      indexing indexa un resumen del documento pero **devuelve el documento
      entero** al generador. RAPTOR agrupa documentos, resume cada grupo y repite
      el proceso recursivamente, indexándolo todo junto, para que las preguntas
      generales encuentren resúmenes y las específicas encuentren hojas. Y
      ColBERT, en vez de comprimir el documento en un vector, genera uno **por
      token** y suma las similitudes máximas.

      **Razonamiento sobre el flujo.** CRAG califica cada documento recuperado y,
      si ninguno sirve, se va a buscar a la web. Adaptive RAG añade
      comprobaciones de alucinación y de si la respuesta contesta la pregunta.
      Todo montado como máquina de estados, con una idea que nombra bien: dedicar
      diez minutos a dibujar el flujo antes de escribir nada, porque después cada
      nodo es solo una función que modifica el estado.

      **Y la última media hora: ¿está muerto RAG?** Con ventanas de un millón de
      tokens, la pregunta es legítima. Se asoció con Greg Kamradt (el mismo del
      video de troceo del día 1) para medirlo en serio: extendió la prueba de la
      aguja en el pajar a **varias agujas** repartidas por el contexto. Tres
      resultados, y los tres importan: **el rendimiento cae según aumenta el
      número de hechos** a recuperar; **razonar sobre lo recuperado es más
      difícil que recuperarlo**; y **los hechos colocados al principio del
      contexto se recuperan peor que los del final**, un efecto que empeora
      cuanto más largo es el contexto y que atribuye al sesgo de cercanía. Su
      conclusión, con una cita de Frank Zappa: RAG no está muerto, solo huele
      raro.
    valioso:
      - |
        **El experimento de las varias agujas.** Es la respuesta empírica a "mete
        todo en el contexto y ya": más hechos empeoran el resultado, razonar
        cuesta más que recuperar, y lo que está al principio se olvida. Nada de
        eso se ve con una sola aguja.
      - |
        **Su escepticismo con las pruebas de aguja en el pajar que publican los
        proveedores de modelos**: suelen usar una sola aguja, sin razonamiento, y
        muy distinta del texto de fondo. Si la aguja se parece más al fondo, la
        recuperación empeora. Es una lección de cómo leer un benchmark.
      - |
        **Los dos argumentos que sobreviven aunque el contexto sea infinito**: con
        todo metido en el prompt **no puedes auditar** de dónde salió la
        respuesta, y **no puedes gestionar permisos** cuando distintos usuarios
        deben ver distintos documentos. Ninguno de los dos es un problema de
        capacidad, así que ninguno se arregla con más tokens.
      - |
        **HyDE y su observación de base**: la pregunta y el documento son objetos
        de texto distintos, y compararlos directamente es comparar peras con
        manzanas. Generar un documento hipotético es una forma de llevar la
        pregunta al espacio donde viven los documentos.
      - |
        **Step-back como espejo de la descomposición**: casi todas las técnicas
        van hacia lo concreto, y esta va hacia lo abstracto. Útil cuando el
        corpus tiene capítulos conceptuales y capítulos de implementación.
      - |
        **"Como poner un agente sobre rieles."** Su comparación entre flujos
        definidos y agentes: los primeros son menos flexibles y mucho más
        fiables, y permiten usar modelos más pequeños y rápidos. Es el mejor
        resumen que conozco de esa decisión.
      - |
        **Dibuja el flujo antes de programarlo.** Dice que diez minutos de diseño
        del grafo se pagan solos, porque después cada nodo es una función que
        recibe un estado y devuelve otro.
    conecta: |
      Este video es el mapa completo del territorio que el curso recorre a pie.
      Verlo hoy, al cerrar la sesión 04, sirve sobre todo para situarte: casi
      todo lo que enseña o ya lo hiciste o lo vas a hacer.

      **Lo que acabas de hacer.** Tu `v0.4` expande la consulta antes de buscar;
      eso es su multi-query, con otro nombre y sin framework.

      **Lo que viene en la sesión 05, técnica por técnica.** Sus vectores
      dispersos son BM25, el día 6. Su **Reciprocal Rank Fusion** es tu función
      `rrf()` del día 6, con la misma constante de 60. Su multi-representation
      indexing y el parent-document que menciona son la palanca D del día 9. Su
      construcción de consultas hacia filtros de metadata es la palanca B, el
      self-query. Y toda su sección de traducción de la consulta es la palanca A.

      **Lo que viene en la sesión 06.** CRAG y adaptive RAG son el loop agéntico:
      el modelo decide si lo recuperado sirve, y si no, vuelve a intentarlo por
      otra vía.

      Pero lo que de verdad justifica este video hoy es el final. Tu día de hoy
      trata precisamente de que **parecerse no es lo mismo que servir**, y su
      experimento de las varias agujas dice lo mismo desde el otro extremo del
      problema: ni siquiera regalándole al modelo todo el contexto desaparece la
      necesidad de decidir qué entra y en qué orden. Sus tres hallazgos son, uno
      por uno, argumentos a favor de medir el retrieval en vez de confiar en él,
      que es exactamente donde arranca la sesión 05.
    reparos: |
      **Enseña catorce técnicas y no mide casi ninguna.** Esta es la crítica
      importante y tiene su ironía: la última media hora del propio video es un
      experimento cuantitativo bien hecho, con condiciones controladas y
      resultados que se sostienen. Sabe medir. Pero las catorce técnicas
      anteriores se presentan con una demo cualitativa cada una, sin comparar
      recall antes y después sobre un conjunto de referencia. Te vas con un menú
      largo y sin forma de saber cuál de esos platos mejora tu caso.

      **Todo el código es LangChain y LangGraph.** Es lógico, trabaja allí, y las
      abstracciones ocultan justo lo que este curso quiere que veas por dentro.
      Quédate con las ideas y no con las llamadas.

      **Está fechado, y en un año que cambió mucho.** Es de principios de 2024:
      habla de GPT-4 con 128k tokens y de Command R como modelo pequeño y rápido.
      El marco conceptual aguanta perfectamente; los nombres y las cifras, no.

      **Su pregunta de si RAG ha muerto tiene hoy una respuesta más matizada.**
      Los modelos de 2026 manejan el contexto largo mucho mejor que los que él
      probó, así que la penalización que midió es menor de lo que era. Pero la
      dirección de sus tres hallazgos sigue en pie, y sus dos argumentos no
      técnicos, auditoría y permisos, no han cambiado nada.

      **ColBERT queda a medias.** Lo presenta, reconoce que la latencia es una
      pregunta abierta y que habría que mirar si está listo para producción, y no
      resuelve ninguna de las dos cosas. Está bien saber que existe; no lo tomes
      como una recomendación.

