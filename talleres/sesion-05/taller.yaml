# Guion del taller de la sesión 05.
#
# REGLA DEL FORMATO: aquí NO se escribe código. Solo se apunta a los archivos
# de codigo/ con un rango de líneas. El generador los lee y los inyecta en el
# HTML, y además verifica que entre todos los pasos no quede ni una línea sin
# explicar. Si el archivo cambia, el taller cambia solo.
id: sesion-05
titulo: "Taller 05 · Retrieval avanzado: medir, diagnosticar y mejorar"
kicker: "AI Engineer Coaching · Fase 2: Patrones · Sesión 05"
subtitulo: >-
  Tu RAG ya funciona. La pregunta ahora es otra: ¿recupera el contexto
  correcto, y cómo lo sabes? En 6 días de 30 a 45 minutos, más el día 0 de preparación, construyes el
  instrumento que lo mide y usas sus números para decidir qué arreglar.

codigo: codigo
salidas: salidas

enlaces:
  - texto: "📊 Deck de la sesión"
    url: "../sesiones/sesion-05-rag-avanzado.html"
  - texto: "🏋️ Reto 04 del AI Gym"
    url: "../gym/index.html"
  - texto: "← Portal"
    url: "../index.html"

como_funciona: |
  **Un día = 30 minutos = un archivo que corre.** No leas el taller entero de
  corrido: haz un día, ciérralo, y vuelve mañana. Cada paso trae el código
  completo (botón `Copiar`), el comando para correrlo y la salida real que
  deberías ver: esa salida es tu criterio de "me funcionó", sin tener que
  preguntarle a nadie.

  **Este es el taller más largo del curso: el día 0 de setup y 6 días de 30 a 45
  minutos.** La sesión 05 tiene más del
  doble de código que la 04, y por una buena razón: aquí no se construye otro
  RAG, se construye el **instrumento** que dice si el que ya tienes sirve. Los
  día 1 montan el punto de partida y lo hacen fallar. Los día 1
  construyen la medición. Los días 3 y 4 aplican dos mejoras, cada una
  justificada por un número. El día 5 abre el resto del mapa y el 10 lo
  entrega todo a la sesión 06.

  Marca cada paso con el círculo de la izquierda: tu progreso queda guardado en
  este navegador. Atajos: `j` / `k` para saltar entre pasos, `w` para ajustar
  líneas, `c` para las notas del coach.

historia:
  cab: "La historia de esta sesión"
  entrada: |
    Terminaste la sesión 04 con un RAG que funciona: parte tus documentos, los
    guarda como vectores, busca los más parecidos a la pregunta y responde
    citando sus fuentes. Lo probaste, contestó bien, y te fuiste tranquilo.

    **Esta sesión existe porque esa tranquilidad no está justificada.** Tu RAG
    tiene un fallo que no produce ningún error: cuando no encuentra la
    información correcta, responde educadamente que no tiene evidencia. Se ve
    exactamente igual que un sistema que se porta bien. No hay excepción, no hay
    log rojo, no hay nada que te avise. Y la respuesta estaba en tus documentos.

    Durante seis días vas a hacer tres cosas, en este orden, porque el orden es
    la mitad de la lección.
  actos:
    - titulo: "Verlo fallar"
      texto: >-
        Montas el corpus, recuperas el RAG de la sesión 04 sin tocarle una coma,
        y le haces cuatro preguntas cuya respuesta está en los documentos. Dos
        fallan. Vas a ver el chunk correcto quedar de cuarto, con similitud
        0.387, y al umbral cortarlo por trece milésimas mientras deja pasar dos
        chunks irrelevantes.
      dias: "día 1"
    - titulo: "Poder medirlo"
      texto: >-
        Cuatro ejemplos elegidos a mano no demuestran nada: con ejemplos
        escogidos puedes probar lo que quieras. Así que construyes el
        instrumento: un conjunto de preguntas con su respuesta correcta, dos
        métricas y un diagnóstico que separa "no llegó" de "llegó mal
        ordenado". Ahí aparece el primer número honesto de la sesión.
      dias: "día 1"
    - titulo: "Arreglarlo, y demostrar que lo arreglaste"
      texto: >-
        Dos mejoras, cada una elegida porque el diagnóstico la pidió, no porque
        la técnica suene bien. Cada una se mide contra el número anterior. Y una
        de las dos, la más vistosa, es también la más lenta: vas a verlo en la
        misma tabla.
      dias: "días 3 a 6"
  cierre: |
    Al final tendrás el mismo RAG respondiendo mejor. Pero lo que de verdad te
    llevas es otra cosa: **la capacidad de responder "¿y cómo sabes que
    mejoró?" con una tabla en vez de con una opinión.** Esa pregunta es la que
    separa a alguien que usa modelos de alguien que construye sistemas con
    ellos.

cierre:
  titulo: "Ya no crees que tu retrieval funciona: lo demuestras"
  texto: |
    Tienes un golden set, dos métricas, un diagnóstico que separa los fallos de
    orden de los de recuperación, y una tabla que compara cuatro variantes con
    su latencia al lado. El recall@1 pasó de 0.60 a 1.00, y cada paso del camino
    se tomó porque un número lo pedía, no porque la técnica sonara bien.

    Y algo que vale más que el 1.00: sabes leer la tabla sin engañarte. Que
    "solo BM25" empate al híbrido en recall@1 y aun así sea la peor opción, o
    que un corpus de 23 chunks infle el mérito del reranker, son lecturas que
    solo se hacen con los datos delante.
  siguiente:
    id: sesion-06
    titulo: "Taller 06 · Agentes: el loop"
    resumen: >-
      El modelo deja de ejecutar tu pipeline y empieza a decidir qué herramienta
      usar y en qué orden. Llega apoyado en un retrieval que ya sabes medir.
    deck: "../sesiones/sesion-06-agentes-loop.html"
  acciones:
    - texto: "🏋️ Entrega el reto 04 del AI Gym"
      url: "../gym/index.html"
    - texto: "📊 Repasar el deck de la sesión 05"
      url: "../sesiones/sesion-05-rag-avanzado.html"
    - texto: "← Volver al portal"
      url: "../index.html"

dias:
  # =========================================================================
  - etiqueta: "Día 0 · Antes de empezar"
    titulo: "Preparar el entorno"
    minutos: 10
    meta: >-
      Este taller reutiliza lo de la sesión 04 y añade una librería nueva:
      `rank_bm25`, el buscador léxico que vas a fusionar con los vectores.
    checkpoint: >-
      `python -c "import anthropic, chromadb, rank_bm25"` no da error y
      `ANTHROPIC_API_KEY` está en tu shell.
    pasos:
      - titulo: "Carpeta, entorno virtual y dependencias"
        minutos: 5
        objetivo: >-
          Tres librerías: el SDK, el vector store de la sesión 04 y BM25.
        codigo:
          archivo: requirements.txt
        bloques:
          - lenguaje: bash
            texto: |
              mkdir -p ~/talleres/sesion-05
              cd ~/talleres/sesion-05
              python3 -m venv .venv
              source .venv/bin/activate
              pip install -r requirements.txt
        porque: >-
          `rank_bm25` es Python puro y pesa nada: no descarga modelos ni pide
          llaves. BM25 es un algoritmo de 1994, y esa es parte de la lección
          del día 3.

      - titulo: "Tu API key y los documentos"
        minutos: 5
        objetivo: >-
          Seis de los diez días llaman al modelo. Y el corpus de ejemplo son
          cinco documentos Markdown que vas a crear en `docs/` al empezar el
          día 1.
        bloques:
          - lenguaje: bash
            texto: |
              export ANTHROPIC_API_KEY="sk-ant-..."   # tu llave real
              python -c "import anthropic, chromadb, rank_bm25; print('entorno listo')"
              ls docs/
        salida_texto: |
          entorno listo
          api-pagos.md	changelog-2025.md	changelog-2026.md	errores.md	webhooks.md
        porque: >-
          Los cinco documentos no aparecen solos: los copias del día 1, donde están
          completos y listos para pegar. Créalos antes de correr nada, porque
          `base.py` lee esa carpeta con `glob` y una carpeta que no existe
          devuelve una lista vacía **sin dar error**: acabarías con cero chunks
          y un RAG que contesta "no tengo evidencia" a todo.

          Fíjate en los dos changelogs, de 2025 y 2026. No están por casualidad:
          son el caso que necesitas para entender el metadata filtering del
          día 5, donde un documento viejo compite con el nuevo y gana.
        nota_coach: >-
          Los días 4, 5 y 6 no gastan nada: BM25, RRF y las métricas son cálculo
          local. El día 4 es el más caro (el reranker hace una llamada por
          query, 15 en total).

  # =========================================================================
  - etiqueta: "Día 1"
    vienes_de: >-
       Ayer preparaste el entorno. Hoy montas todo lo que la sesión necesita y
       lo ves romperse.
    titulo: "El punto de partida: monta el RAG de la 04 y hazlo fallar"
    minutos: 35
    meta: >-
       Tres archivos y una corrida. El corpus compartido con su chunking, el RAG
       de la sesión 04 intacto, y cuatro preguntas cuya respuesta está en los
       documentos. Dos van a fallar, y cómo fallan es la sesión entera. Es el
       día con más código para copiar del taller y el que menos tienes que
       entender línea a línea: casi todo lo viste en la sesión 04.
    archivo_completo:
      - base.py
      - golden.json
      # El corpus. Sin estos cinco archivos, base.py devuelve cero chunks y el
      # taller entero contesta "no tengo evidencia" a todo, sin lanzar un solo
      # error. Es exactamente el fallo que esta sesión enseña a detectar, así
      # que aquí no puede pasar: se entregan.
      - docs/api-pagos.md
      - docs/errores.md
      - docs/webhooks.md
      - docs/changelog-2025.md
      - docs/changelog-2026.md
      - rag.py
      - 00_punto_de_partida.py
    checkpoint: >-
      Ves dos "No tengo evidencia para responder" cuya evidencia sí estaba en el
      corpus. Puedes explicar la diferencia entre "no se recuperó" y "se
      recuperó pero el umbral lo cortó".
    te_deja: >-
       Acabas de ver el fallo con tus propios ojos: el chunk correcto recuperado
       de cuarto y cortado por trece milésimas. Pero fallaron dos de cuatro
       preguntas que **tú elegiste**, y ese 50% no significa nada. Con ejemplos
       escogidos a mano se demuestra cualquier cosa. Mañana empieza lo que
       convierte esto en una medición.
    pasos:
      - titulo: "La metadata que todavía no usas"
        minutos: 9
        objetivo: >-
          Archivo nuevo, `base.py`. No se ejecuta solo: los demás lo importan.
        define:
          - termino: 'Chunk'
            es: >-
              Un trozo de documento, del tamaño que decidas al partirlo. Es la
              unidad con la que trabaja todo el sistema: se indexa un chunk, se
              recupera un chunk, y lo que se le entrega al modelo son chunks. Si
              el corte está mal hecho, todo lo demás hereda el problema.
          - termino: 'Metadata'
            es: >-
              Datos **sobre** el documento, no dentro de él: de qué año es, de
              qué tipo, quién lo escribió. No se usa para buscar por
              significado, sino para **descartar** antes de buscar.
        codigo:
          archivo: base.py
          lineas: "1-33"
        python:
          - de: '"""..."""'
            es: >-
              Las triple comillas al principio de un archivo son un
              **docstring**: la documentación del módulo. No es un comentario,
              es un texto que queda guardado en el programa y que puedes leer
              con `help(base)`. Los `#` sí son comentarios y desaparecen al
              ejecutar.
          - de: 'import json'
            es: >-
              Trae un módulo entero. A partir de ahí lo usas con su nombre
              delante: `json.loads(...)`. Es la forma más común y la más fácil
              de rastrear, porque siempre se ve de dónde sale cada función.
          - de: 'from pathlib import Path'
            es: >-
              Trae **solo** una pieza del módulo, y la usas sin prefijo:
              `Path(...)` en vez de `pathlib.Path(...)`. Úsalo cuando vas a
              repetir mucho ese nombre.
          - de: 'Path(__file__).parent'
            es: >-
              `__file__` es una variable que Python rellena solo con la ruta del
              archivo que se está ejecutando. `.parent` sube un nivel, a la
              carpeta que lo contiene. Juntos dan "la carpeta donde vivo yo",
              que no cambia aunque ejecutes el script desde otro sitio.
          - de: 'METADATA_DOCS = {...}'
            es: >-
              Un **diccionario**: pares de clave y valor entre llaves. Aquí la
              clave es el nombre del archivo y el valor es otro diccionario. Se
              lee con corchetes: `METADATA_DOCS["errores.md"]` devuelve
              `{"tipo": "referencia", "anio": 2026}`.
          - de: 'MAYÚSCULAS'
            es: >-
              Por convención, un nombre en mayúsculas señala una **constante**:
              algo que se define una vez y no se vuelve a tocar. Python no lo
              impide, es un acuerdo entre programadores para que se lea de un
              vistazo.
        porque: >-
          `METADATA_DOCS` no hace nada hoy y no lo va a hacer hasta el día 5.
          Está aquí porque el metadata filtering solo funciona si la metadata
          existe **desde la ingesta**, y a eso no se llega retroactivamente sin
          reindexar todo el corpus.

          El detalle de `anio` sin eñe tampoco es capricho: va a ser una clave
          de filtro en Chroma, y los nombres ASCII evitan sorpresas de
          codificación en las que se pierden tardes enteras.

      - titulo: "Chunking por estructura, otra vez"
        minutos: 10
        objetivo: >-
          El mismo corte por títulos `##` y `###` de la sesión 04, con un
          añadido importante: cada chunk lleva un id estable.
        codigo:
          archivo: base.py
          lineas: "34-72"
          nuevo: true
        python:
          - de: '.glob("*.md")'
            es: >-
              Busca archivos que encajen con un patrón. El `*` significa
              "cualquier cosa", así que `*.md` son todos los archivos que
              terminan en `.md`. Va envuelto en `sorted(...)` para que el orden
              sea siempre el mismo en cualquier máquina.
          - de: 'docs.append((texto, nombre))'
            es: >-
              `.append()` añade **un** elemento al final de una lista. Fíjate en
              el doble paréntesis: el elemento que añadimos es una **tupla**,
              dos valores pegados. Una tupla es como una lista pero no se puede
              modificar.
          - de: 'chunks.extend(otra_lista)'
            es: >-
              Aquí está la diferencia que más confunde. `.append(lista)` mete la
              lista entera como **un solo elemento** (te queda una lista de
              listas). `.extend(lista)` mete **sus elementos uno por uno**. Como
              `chunk_markdown` devuelve varios chunks, queremos `extend` para
              acabar con una lista plana.
          - de: 're.split(r"\n(?=#{2,3} )", texto)'
            es: >-
              Corta el texto donde encuentre el patrón. La `r` antes de las
              comillas es una *raw string*: hace que `\n` se entienda tal cual,
              sin interpretarlo. Y `(?=...)` es un **lookahead**: comprueba que
              ahí viene un título pero **no se lo come**, así el título se queda
              dentro del chunk.
          - de: 'sec.splitlines()[0]'
            es: >-
              `.splitlines()` parte un texto en una lista de líneas. El `[0]`
              toma la primera. En Python se empieza a contar desde cero,
              siempre.
          - de: '.lstrip("# ")'
            es: >-
              Quita del **inicio** cualquiera de esos caracteres, aquí `#` y
              espacio. La `l` es de *left*. Existen `.rstrip()` para el final y
              `.strip()` para los dos lados.
          - de: 'f"{fuente} § {titulo}"'
            es: >-
              Una **f-string**: la `f` antes de las comillas permite meter
              variables dentro del texto usando llaves. Sin la `f`, saldría
              literalmente `{fuente} § {titulo}`.
          - de: '**METADATA_DOCS[fuente]'
            es: >-
              Esta es la que preguntabas. Los dos asteriscos **desempaquetan**
              un diccionario dentro de otro. Sin ellos tendrías una clave
              llamada `METADATA_DOCS` con un diccionario dentro; con ellos, las
              claves `tipo` y `anio` entran **al mismo nivel** que `id`, `texto`
              y `seccion`. Es la forma corta de escribir `"tipo": ..., "anio":
              ...` sin repetirlo en cada chunk. El mismo símbolo aparece en las
              funciones (`def f(**kwargs)`), donde hace lo contrario: recoge
              argumentos sueltos y los mete en un diccionario.
        porque: >-
          Ese id, `archivo § sección`, es la pieza que hace posible todo el
          taller. El golden set apunta a estos ids, así que **si cambias el
          chunking, el golden set se revisa**. Suena a molestia y es lo
          contrario: es la garantía de que tu medición sigue midiendo lo mismo
          después de tocar el pipeline.

      - titulo: "Ingesta idempotente y el tokenizador de BM25"
        minutos: 11
        objetivo: >-
          Crear la colección desde cero, cargar el golden set, y un tokenizador
          que parece trivial pero no lo es.
        define:
          - termino: 'Ingesta'
            es: >-
              El proceso de leer tus documentos, convertirlos en vectores y
              guardarlos. Se hace una vez (y se repite cuando cambian los
              documentos), no en cada pregunta.
          - termino: 'Idempotente'
            es: >-
              Que ejecutarlo dos veces deja el mismo resultado que ejecutarlo
              una. Aquí importa porque `add` no sobreescribe: sin borrar antes,
              la segunda corrida mediría el índice viejo creyendo que mide el
              nuevo.
          - termino: 'Golden set'
            es: >-
              El conjunto de preguntas reales con la respuesta correcta anotada
              a mano. Es la vara de medir de toda la sesión: sin él no hay forma
              de saber si un cambio mejoró o empeoró.
        codigo:
          archivo: base.py
          lineas: "73-113"
          nuevo: true
        python:
          - de: 'try: ... except Exception: pass'
            es: >-
              Intenta ejecutar algo y, si revienta, no hace nada. `pass` es la
              instrucción vacía de Python: existe porque el lenguaje necesita
              **algo** ahí dentro. Aquí es correcto porque la primera vez la
              colección no existe y borrarla falla, pero ojo: `except Exception`
              también se traga errores de verdad.
          - de: '[c["id"] for c in chunks]'
            es: >-
              Una **comprensión de lista**: construye una lista nueva
              recorriendo otra. Se lee de dentro afuera: "para cada `c` en
              `chunks`, quédate con `c["id"]`". Equivale a un bucle `for` de
              tres líneas, en una.
          - de: 'textos if textos is not None else [...]'
            es: >-
              El **operador ternario**, un `if` que cabe en una línea y devuelve
              un valor. Se lee: "usa `textos`, si no es `None`; si lo es, usa la
              lista de después". El orden es raro al principio porque la
              condición va en medio.
          - de: 'is not None'
            es: >-
              Para comparar con `None` se usa `is` y no `==`. `is` pregunta
              "¿son el mismo objeto?" y `None` es único en todo el programa.
              Además, `if textos:` no serviría aquí: una lista vacía también es
              falsa, y no es lo mismo que no haber pasado nada.
          - de: 'json.loads(texto)'
            es: >-
              Convierte un texto en JSON a estructuras de Python (diccionarios y
              listas). La `s` final es de *string*. Sin ella,
              `json.load(archivo)` lee de un archivo abierto. Y `dumps`/`dump`
              hacen el camino inverso.
          - de: 're.findall(r"[a-z0-9áéíóúüñ_-]+", texto)'
            es: >-
              Devuelve **todas** las coincidencias del patrón como una lista.
              Los corchetes son un conjunto de caracteres permitidos y el `+`
              significa "uno o más seguidos". El guion va al final a propósito:
              en medio significaría un rango, como `a-z`.
        porque: >-
          Las dos lecciones de la sesión 04 siguen aquí: borrar antes de crear
          (porque `collection.add` salta ids repetidos en silencio) y fijar la
          métrica coseno al crear la colección.

          Lo nuevo es `tokenizar()`. El deck usa `texto.split()`, y eso rompe
          justo el caso que importa: en *"¿qué es el error E-4012?"* el token
          quedaría `"E-4012?"` con el signo pegado, y **nunca** igualaría al
          `"E-4012"` del documento. Bajar a minúsculas y extraer solo
          letras, números y guiones deja `e-4012` como un token limpio. Un
          detalle de cinco líneas que decide si BM25 sirve o no.

      - titulo: "La tesis, en la firma de una función"
        minutos: 8
        objetivo: >-
          Archivo nuevo, `rag.py`. Léelo antes de escribir nada: el docstring es
          la clase de hoy.
        codigo:
          archivo: rag.py
          lineas: "1-21"
        python:
          - de: 'def responder(pregunta, recuperar)'
            es: >-
              La **firma** de una función es su nombre y sus parámetros. Aquí lo
              importante es que `recuperar` no es un dato: es **otra función**.
              En Python las funciones son valores como cualquier otro, así que
              se pueden guardar en variables y pasar como argumento.
        porque: >-
          `responder(pregunta, recuperar)` recibe la función de recuperación
          como **parámetro**. Eso convierte el retrieval en una pieza
          intercambiable, y por eso el resto de la sesión puede comparar cuatro
          estrategias distintas sin tocar ni una línea del generador.

          Es una decisión de diseño diminuta con una consecuencia enorme: si el
          generador cambiara entre variantes, no sabrías a qué atribuir la
          diferencia. Aquí solo cambia una cosa, así que lo que midas es esa
          cosa.

      - titulo: "El umbral, y lo que el umbral no puede hacer"
        minutos: 7
        objetivo: >-
          La configuración: cliente, modelo, umbral calibrado y las reglas de
          grounding.
        define:
          - termino: 'Similitud de coseno'
            es: >-
              Un número entre -1 y 1 que dice cuánto se parecen dos vectores por
              su **dirección**, sin importar su tamaño. Cuanto más cerca de 1,
              más parecido el significado. Es lo que devuelve la búsqueda
              vectorial.
          - termino: 'Umbral'
            es: >-
              El corte mínimo de similitud para que un chunk se considere
              evidencia válida. Por debajo de él, se descarta. Es lo que permite
              que el sistema diga que no sabe en vez de inventar.
        codigo:
          archivo: rag.py
          lineas: "22-41"
          nuevo: true
        python:
          - de: 'client = anthropic.Anthropic()'
            es: >-
              Crea un **objeto** de esa clase, es decir una instancia lista para
              usar. Los paréntesis vacíos significan que no le pasamos
              configuración: la librería busca sola la clave en la variable de
              entorno.
          - de: 'SYSTEM_GENERACION = (
  "..."
  "..."
)'
            es: >-
              Varios textos seguidos dentro de un paréntesis se **pegan
              automáticamente** en uno solo. Es la forma habitual de escribir un
              texto largo repartido en varias líneas sin llenarlo de `+`.
              Cuidado con olvidar un espacio al final de cada trozo: quedarían
              dos palabras pegadas.
        porque: >-
          El `UMBRAL = 0.40` es el mismo de la sesión 04 y hace bien su trabajo:
          evita que basura poco parecida entre al contexto.

          Lee con cuidado el comentario que lo acompaña, porque es el problema
          de toda la sesión: **el umbral filtra por similitud, así que cuando la
          similitud se equivoca, el umbral se equivoca con ella**. Al final de hoy lo vas a ver cortar exactamente el chunk correcto.

      - titulo: "La recuperación vectorial"
        minutos: 7
        objetivo: >-
          El buscador de la sesión 04, tal cual.
        codigo:
          archivo: rag.py
          lineas: "42-64"
          nuevo: true
        python:
          - de: 'def recuperar_vectorial(collection, pregunta, k=4, umbral=UMBRAL)'
            es: >-
              Los parámetros con `=` tienen **valor por defecto**: si no los
              pasas, se usa ese. Por eso puedes llamar a la función con dos
              argumentos o con cuatro. Los que no tienen valor por defecto van
              siempre primero.
          - de: 'zip(a, b, c)'
            es: >-
              Recorre varias listas **a la vez**, dando un elemento de cada una
              en cada vuelta. Aquí Chroma devuelve los ids, los textos y las
              distancias en listas separadas, y `zip` las vuelve a juntar por
              posición. Si tienen distinta longitud, se para en la más corta.
          - de: 'res["ids"][0]'
            es: >-
              Dos accesos encadenados: primero la clave `"ids"` del diccionario,
              después el elemento `0` de la lista que hay dentro. Ese `[0]` está
              porque se puede preguntar por varias consultas a la vez y Chroma
              devuelve un resultado por cada una; nosotros mandamos una sola.
          - de: 'round(similitud, 3)'
            es: >-
              Redondea a los decimales que le digas. Es solo presentación, para
              que la salida se lea; el cálculo se hizo con todos los decimales.
          - de: '"pasa_umbral": similitud >= umbral'
            es: >-
              Una comparación **es** un valor, no solo algo que va dentro de un
              `if`. `similitud >= umbral` produce `True` o `False`, y eso es lo
              que se guarda en el diccionario.
        porque: >-
          Nada nuevo respecto a la sesión 04: top-k por coseno y filtro por
          umbral. Lo que cambia es su estatus: a partir del día 3 esto deja de ser *el* buscador y pasa a ser *una*
           de las cuatro variantes que vas a medir.

      - titulo: "Generar con citas, y el corto-circuito"
        minutos: 8
        objetivo: >-
          El generador y la función que ata todo.
        codigo:
          archivo: rag.py
          lineas: "65-93"
          nuevo: true
        python:
          - de: 'if not evidencias:'
            es: >-
              En Python una lista vacía cuenta como falsa, así que `not
              evidencias` significa "si la lista está vacía". Es más idiomático
              que `len(evidencias) == 0`, y hace lo mismo.
          - de: '"\n\n".join(...)'
            es: >-
              Junta los elementos de una lista en un solo texto, poniendo entre
              ellos el texto sobre el que llamas al método. Se lee al revés de
              como suena: el separador va delante. `"\n\n"` son dos saltos de
              línea, o sea una línea en blanco entre chunk y chunk.
          - de: 'enumerate(evidencias)'
            es: >-
              Recorre una lista dando **la posición y el elemento** a la vez, en
              vez de solo el elemento. Evita el clásico contador manual. Empieza
              en 0, por eso el `i + 1` para numerar las citas de cara al
              usuario.
          - de: 'f"[{i + 1}] ..." for i, e in enumerate(...)'
            es: >-
              Una **expresión generadora**: como una comprensión de lista pero
              sin corchetes, y va directamente dentro del `join`. Va produciendo
              los elementos de uno en uno en vez de construir la lista entera en
              memoria.
          - de: 'resp.content[0].text'
            es: >-
              Se navega por la respuesta del SDK: `content` es una lista de
              bloques (un mensaje puede traer texto, uso de herramientas, etc.),
              tomamos el primero y le pedimos su `.text`.
          - de: '[e for e in recuperar(pregunta) if e.get("pasa_umbral", True)]'
            es: >-
              Una comprensión de lista **con filtro**: el `if` del final decide
              qué entra. Y `.get(clave, valor_por_defecto)` lee del diccionario
              sin reventar si la clave no existe; con `e["pasa_umbral"]` daría
              `KeyError` en los buscadores que no ponen esa clave.
        porque: >-
          Igual que en la sesión 04: si nada supera el umbral, ni se llama al
          modelo. La respuesta honesta sale gratis.

          Guarda ese comportamiento en la cabeza, porque en unos pasos lo vas a
           ver desde el otro lado: un *"no tengo evidencia"* cuando la evidencia
          **sí** existe.

      - titulo: "Dos problemas que parecen uno"
        minutos: 9
        objetivo: >-
          Archivo nuevo, `00_punto_de_partida.py`. Otra vez, el docstring es la
          clase.
        codigo:
          archivo: 00_punto_de_partida.py
          lineas: "1-32"
        porque: >-
          La distinción que fija todo lo que viene: **el modelo alucina** (lo
          resolvió la sesión 04 con umbral y citas) contra **el retrieval trae
          lo que no es** (nadie lo ha resuelto todavía).

          Y el síntoma es traicionero: el RAG dice "no tengo evidencia" y parece
          que se porta bien. No inventó nada, cumplió las reglas. Pero la
          respuesta estaba ahí y no supo traerla. Sin métricas, ese fallo es
          **invisible**: no hay excepción, no hay log de error, no hay nada que
          alerte.

      - titulo: "Cuatro preguntas elegidas a mano"
        minutos: 7
        objetivo: >-
          Dos que el RAG contesta bien y dos que falla, todas con respuesta
          explícita en el corpus.
        codigo:
          archivo: 00_punto_de_partida.py
          lineas: "33-58"
          nuevo: true
        python:
          - de: 'import base'
            es: >-
              Importa **tu propio archivo** `base.py`, que está en la misma
              carpeta. Python no distingue entre módulos tuyos y de terceros: si
              el archivo está donde él puede verlo, se importa igual que `json`.
          - de: 'PREGUNTAS = [ (…, …), … ]'
            es: >-
              Una lista de tuplas. Cada elemento tiene dos partes, la pregunta y
              dónde estaba la respuesta, y luego se desempaquetan de golpe en el
              bucle: `for pregunta, donde in PREGUNTAS`. Python reparte los
              valores por posición.
          - de: 'None'
            es: >-
              El valor "aquí no hay nada". No es cero ni texto vacío: es un
              valor propio que significa ausencia. Aquí marca las preguntas que
              sí se responden bien y por tanto no necesitan la nota de dónde
              estaba la respuesta.
        porque: >-
          Fíjate en que cada pregunta que falla trae anotado **dónde estaba la
          respuesta**. Eso no es decoración: es lo que convierte una demo en un
          diagnóstico. "Falló" no sirve de nada; "falló y el chunk correcto era
          este" te dice qué mirar.

      - titulo: "Ver el top-4 con sus números"
        minutos: 6
        objetivo: >-
          Imprimir los cuatro candidatos con su similitud y si pasan el umbral.
        codigo:
          archivo: 00_punto_de_partida.py
          lineas: "59-75"
          nuevo: true
        python:
          - de: '"=" * 72'
            es: >-
              Multiplicar un texto por un número lo **repite**. Es la forma
              corta de dibujar una línea separadora sin escribir 72 iguales.
          - de: 'enumerate(evidencias, 1)'
            es: >-
              El segundo argumento dice desde qué número empezar a contar. Por
              defecto empieza en 0; aquí queremos numerar de cara al lector, así
              que empieza en 1 y nos ahorramos el `i + 1`.
          - de: 'f"{e[''similitud'']:.3f}"'
            es: >-
              Los dos puntos dentro de las llaves abren el **formato**. `.3f`
              significa "decimal con 3 cifras". Sin él saldría
              `0.38700000000000001`. Fíjate en las comillas simples dentro de la
              f-string de comillas dobles: no se pueden repetir las mismas por
              dentro y por fuera.
          - de: 'lambda p: evidencias'
            es: >-
              Una función anónima de una línea. `lambda p: evidencias` es una
              función que recibe `p` y devuelve siempre `evidencias`, ignorando
              lo que le pasen. Sirve para reutilizar la recuperación que ya
              hicimos en vez de repetirla.
        porque: >-
          Marcar `pasa` o `CORTA` al lado de cada similitud es lo que hace
          visible el fallo del paso siguiente. Con solo la respuesta final
          verías "no tengo evidencia" y no sabrías por qué.

      - titulo: "Correrlo y encontrarse con los dos fallos"
        minutos: 8
        objetivo: >-
          Las cuatro preguntas, una detrás de otra.
        codigo:
          archivo: 00_punto_de_partida.py
          lineas: "76-103"
          nuevo: true
        corre: |
          python 00_punto_de_partida.py
        salida:
          archivo: 00_punto_de_partida.txt
          lineas: "52-80"
        python:
          - de: 'if __name__ == "__main__":'
            es: >-
              La línea más críptica de Python y la más útil. `__name__` vale
              `"__main__"` cuando ejecutas el archivo directamente, y el nombre
              del módulo cuando otro archivo lo importa. Traducido: **"ejecuta
              esto solo si me estás corriendo a mí, no si me están
              importando"**. Sin ella, importar este archivo dispararía todo el
              pipeline sin querer.
          - de: 'if donde_estaba:'
            es: >-
              Comprobar un valor sin comparar nada. En Python, `None`, el cero,
              el texto vacío y las listas vacías cuentan como falsos; casi todo
              lo demás como verdadero. Así que esto significa "si hay algo ahí".
        porque: >-
          Mira la pregunta de `sk_test_`. El chunk correcto (`api-pagos.md §
          Autenticación`) **sí se recuperó**, quedó de cuarto con similitud
          0.387, y el umbral lo cortó por trece milésimas. Mientras tanto dejó
          pasar dos chunks irrelevantes con similitud más alta.

          Ese es el problema en una imagen: el umbral no sabe qué es correcto,
          solo sabe qué es parecido. Cuando el orden por similitud se equivoca,
          el umbral hereda el error.

          Y lee el cierre del script, que es la parte más honesta: *"aquí
          fallaron dos de cuatro preguntas, pero ese 50% no significa nada: yo
          elegí las cuatro"*. Con ejemplos escogidos a mano puedes demostrar lo
          que quieras, en cualquier dirección. Eso es una anécdota. Mañana
          empieza la medición.

  # =========================================================================
  - etiqueta: "Día 2"
    vienes_de: >-
       Ayer viste fallar el RAG con cuatro preguntas que elegiste tú, y quedó
       claro que cuatro anécdotas no son una medición.
    titulo: "El instrumento, y el primer número honesto"
    minutos: 30
    meta: >-
       Hoy construyes lo que convierte esa impresión en un dato: dos métricas,
       un diagnóstico que separa los fallos por tipo, y la primera corrida
       contra 15 preguntas reales. Sale el número que vas a tener que superar el
       resto de la semana.
    archivo_completo:
      - metricas.py
      - 01_medir_el_baseline.py
      # El script de hoy importa retrieval.py, que se escribe entero mañana.
      # Se entrega aquí para que el día 2 corra: hoy solo usas su primera
      # función, buscar_vectores, y mañana lo lees línea por línea.
      - retrieval.py
    checkpoint: >-
      Tienes el baseline (recall@1 0.60, MRR 0.71) y el reparto de fallos: 9
      correctas, 3 de orden, 3 de recuperación. Puedes decir qué patrón comparten
      las que fallan.
    te_deja: >-
       Tienes el baseline y, más importante, sabes **qué tipo** de error tienes:
       3 fallos de recuperación por términos literales. Eso no es una intuición,
       es un conteo. Y contra un fallo de recuperación por términos literales existe una
       técnica concreta, la búsqueda léxica, que es lo que escribes mañana.
    video:
      id: 9QJXvNiJIG8
      porque: >-
        Una comparativa medida de BM25 contra embeddings, que es lo mismo que
        acabas de hacer tú pero sobre otro corpus. Compara sus números con los
        tuyos: si difieren, la pregunta interesante es por qué.
    pasos:
      - titulo: "La convención que hace comparables las variantes"
        minutos: 6
        objetivo: >-
          Archivo nuevo, `metricas.py`. Tampoco se ejecuta solo.
        codigo:
          archivo: metricas.py
          lineas: "1-30"
        porque: >-
          Dos diccionarios y una regla: `golden` mapea query a id correcto,
          `results` mapea query a la lista de ids que devolvió el buscador. Con
          esa convención, **cualquier** estrategia de búsqueda se puede evaluar
          con el mismo código. Es la contraparte de la firma común que viste
          ayer en `rag.py`.

      - titulo: "Recall@k y MRR"
        minutos: 8
        objetivo: >-
          Las dos métricas del deck, en unas pocas líneas cada una.
        define:
          - termino: 'recall@k'
            es: >-
              De todas tus preguntas, en qué fracción el chunk correcto apareció
              entre los primeros **k** resultados. Es un sí o un no por
              pregunta, promediado. `recall@1 = 0.60` significa que en el 60% de
              los casos lo correcto salió de primero.
          - termino: 'MRR'
            es: >-
              *Mean Reciprocal Rank*. Igual que el recall, pero premia que lo
              correcto salga **arriba**: de primero suma 1, de segundo 0.5, de
              tercero 0.33. Dos sistemas con el mismo recall pueden tener MRR
              muy distinto, y el que ordena mejor le pone el trabajo más fácil
              al generador.
        codigo:
          archivo: metricas.py
          lineas: "31-55"
          nuevo: true
        python:
          - de: 'sum(1 for q in golden if …)'
            es: >-
              Cuenta cuántos elementos cumplen la condición: produce un `1` por
              cada uno que pasa el filtro y los suma. Es el modo idiomático de
              contar sin escribir un contador a mano.
          - de: 'results[q][:k]'
            es: >-
              **Rebanada** (*slice*): toma los primeros `k` elementos de la
              lista. Los dos puntos separan inicio y fin; si omites el inicio,
              empieza desde el principio. Nunca falla aunque la lista sea más
              corta que `k`.
          - de: 'golden[q] in results[q][:k]'
            es: >-
              `in` pregunta si un elemento está dentro de una colección, y
              devuelve `True` o `False`. En listas recorre elemento por
              elemento; en diccionarios busca entre las claves y es instantáneo.
          - de: '.index(valor)'
            es: >-
              Devuelve **la posición** de la primera aparición de ese valor.
              Cuidado: si no está, lanza `ValueError` en vez de devolver `None`,
              y por eso el código siempre comprueba antes con `in`.
          - de: 'total = 0.0'
            es: >-
              El punto cero no sobra. Arrancar en `0.0` deja claro que la
              variable acumula decimales, no enteros. Python lo resolvería
              igual, pero se lee mejor.
        porque: >-
          **Recall@k** responde "¿está el chunk correcto entre los primeros k?".
          Es un sí o un no, promediado sobre todas las queries.

          **MRR** responde algo más fino: "¿en qué posición está?". Si sale de
          primero suma 1, de segundo 0.5, de tercero 0.33. Dos sistemas con el
          mismo recall@5 pueden tener MRR muy distinto, y el que ordena mejor es
          el que le pone el trabajo más fácil al generador.

      - titulo: "El diagnóstico, que es lo que el deck no tiene"
        minutos: 9
        objetivo: >-
          Clasificar cada query fallida en dos tipos: no llegó, o llegó mal
          ordenada.
        define:
          - termino: 'Fallo de recuperación'
            es: >-
              El chunk correcto no llegó a estar entre los que el RAG entrega al
              modelo. Da igual cómo lo reordenes después: lo que no está no se
              rescata.
          - termino: 'Fallo de orden'
            es: >-
              El chunk correcto sí llegó, pero enterrado bajo ruido. Este sí se
              arregla reordenando, y por eso conviene distinguirlo del anterior
              antes de elegir la herramienta.
        codigo:
          archivo: metricas.py
          lineas: "56-83"
          nuevo: true
        python:
          - de: 'def sintoma(golden, results, q, k=K_UTIL)'
            es: >-
              El valor por defecto puede ser una constante definida antes. Se
              evalúa **una sola vez**, cuando Python lee la definición de la
              función, no en cada llamada. Para números y textos da igual; con
              listas o diccionarios como valor por defecto ese detalle causa
              errores célebres.
          - de: 'if pos is None or pos > k:'
            es: >-
              El `or` corta en cuanto puede: si `pos` es `None`, ya no evalúa
              `pos > k`. Eso importa aquí, porque comparar `None > 4`
              reventaría. El orden de las dos condiciones no es casual.
          - de: 'conteo[sintoma(...)] += 1'
            es: >-
              Usar un diccionario como contador. La función devuelve el nombre
              del síntoma, ese nombre es la clave, y `+= 1` suma uno a lo que
              hubiera. Funciona porque las tres claves ya existen inicializadas
              en cero.
        porque: >-
          Aquí está la bisagra de toda la sesión, y merece leerse dos veces.

          `K_UTIL = 4` no es un parámetro arbitrario: es **cuántos chunks
          entrega tu RAG al generador**. Un chunk en la posición 6 de tu ranking
          nunca llega al modelo, así que para el sistema real es idéntico a no
          haberlo encontrado. Diagnosticar en top-10 cuando entregas 4 te dice
          que tienes un problema de orden cuando en realidad tienes uno de
          recuperación.

          Y esa distinción fija el orden de trabajo, que **no es negociable**:
          reordenar no rescata un chunk que nunca se recuperó. Primero
          recuperación, después orden. Es la razón por la que el reranking, que
          es la técnica más vistosa, llega en el día 4 y no en el 6.

      - titulo: "El evaluador y la tabla"
        minutos: 7
        objetivo: >-
          Correr una estrategia sobre todo el golden set y formatear la fila.
        codigo:
          archivo: metricas.py
          lineas: "84-110"
          nuevo: true
        python:
          - de: '{q: buscar(q) for q in golden}'
            es: >-
              Una **comprensión de diccionario**: como la de lista pero produce
              pares de clave y valor. Se lee "para cada `q`, guarda `buscar(q)`
              bajo la clave `q`". Recorrer un diccionario da sus claves, no sus
              valores.
          - de: 'def evaluar(golden, buscar)'
            es: >-
              Otra vez una función recibida como parámetro. `buscar` puede ser
              cualquier cosa que se pueda llamar con una query: eso es lo que
              permite medir las cuatro variantes con este mismo código.
          - de: 'f"{nombre:<26}"'
            es: >-
              Formato de alineación: `<` a la izquierda, `>` a la derecha, `^`
              centrado, y el número es el ancho mínimo en caracteres. Es lo que
              hace que las columnas de la tabla queden cuadradas en la terminal.
          - de: 'f"{valor:>8.2f}"'
            es: >-
              Se pueden combinar: alineado a la derecha en 8 caracteres, con 2
              decimales. Sin la alineación los números bailarían y la tabla
              sería ilegible.
        porque: >-
          `evaluar()` recibe la función de búsqueda como argumento, igual que
          `responder()` en `rag.py`. Ese patrón se repite en toda la sesión
          porque es lo que permite agregar una variante nueva con una línea, en
          vez de duplicar el evaluador.

      - titulo: "Por qué 15 queries y no cuatro"
        minutos: 8
        objetivo: >-
          Archivo nuevo, `01_medir_el_baseline.py`. El golden set ya está en
          `golden.json`, escrito a mano.
        codigo:
          archivo: 01_medir_el_baseline.py
          lineas: "1-34"
        porque: >-
          El golden set es un **artefacto del proyecto**, no código: se escribe a
          mano, se versiona y se discute en los PRs. Quince queries no son
          muchas, y son suficientes para dejar de opinar.

          Ábrelo y míralo. Cada entrada es una pregunta real y el id del chunk
          que debería salir. Escribir eso te obliga a decidir qué es una
          respuesta correcta, que es un trabajo que nadie puede hacer por ti.

      - titulo: "Las etiquetas del diagnóstico"
        minutos: 5
        objetivo: >-
          Tres símbolos para tres estados.
        codigo:
          archivo: 01_medir_el_baseline.py
          lineas: "35-41"
          nuevo: true
        porque: >-
          Un detalle de presentación con efecto real: cuando los tres estados se
          distinguen de un vistazo, el patrón salta a la vista en la corrida. Sin
          eso tendrías quince líneas de texto y ninguna conclusión.

      - titulo: "Medir, listar y diagnosticar"
        minutos: 17
        objetivo: >-
          La tabla del baseline, el detalle query por query, y el reparto por
          síntoma.
        codigo:
          archivo: 01_medir_el_baseline.py
          lineas: "42-104"
          nuevo: true
        corre: |
          python 01_medir_el_baseline.py
        si_falla:
          - error: "ModuleNotFoundError: No module named 'retrieval'"
            arreglo: >-
              Hoy usas una función de `retrieval.py`, que escribes mañana
              entero. Cópialo del panel plegable que hay al final de este día;
              mañana lo recorres línea por línea.
          - error: "Corpus: 0 chunks · Golden set: 15 queries"
            arreglo: >-
              La carpeta `docs/` está vacía o no existe. `glob` no falla cuando
              no encuentra nada, así que el script sigue con cero chunks. Copia
              los cinco documentos del día 1.
        salida:
          archivo: 01_medir_el_baseline.txt
          lineas: "1-43"
        porque: >-
          **recall@1 = 0.60.** Cuatro de cada diez veces, el chunk correcto no
          sale de primero. Ese número no existía ayer, y ahora todo lo que hagas
          se compara contra él.

          Pero el número global no dice qué hacer. El reparto sí: **9 correctas,
          3 fallos de orden, 3 de recuperación**. Y las que fallan comparten un
          patrón que se ve leyendo la lista: todas se apoyan en un término
          literal del documento (`sk_test_`, "cobros duplicados", "firma") y el
          embedding lo suaviza hacia el tema general. Por eso gana el chunk
          introductorio genérico, *"Guía de Webhooks"*, sobre la sección
          específica que responde.

          Eso es exactamente la slide *"dónde se rompe el vector search puro"*:
          brilla en paráfrasis, falla en lo exacto. Y "fallo de recuperación por
          términos literales" tiene una palanca con nombre propio, que es el
          día 3.
        nota_coach: >-
          Vale la pena parar aquí y preguntar qué harían con estos números antes
          de seguir. Si alguien propone el reranker, es el momento perfecto para
          señalar los 3 fallos de recuperación: reordenar no los arregla.

