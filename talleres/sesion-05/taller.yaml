          lineas: "1-41"
        porque: >-
          Sesión 04: cómo le doy al modelo acceso confiable a mis documentos.
          Sesión 05: ya funciona, ¿recupera lo correcto y cómo lo mejoro?
          Sesión 06: cuándo el modelo debe **decidir** qué herramienta usar.

          Cada una necesita que la anterior esté resuelta. Un agente que usa una
          herramienta cuya calidad nadie midió es un agente en el que no puedes
          confiar.

      - titulo: "El retrieval de la sesión, empaquetado"
        minutos: 7
