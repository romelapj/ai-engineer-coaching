    te_deja: >-
       El híbrido ganó, pero la tabla trae una trampa que conviene no tragarse:
       BM25 solo empata en recall@1 y gana en recall@5. Si te quedas ahí,
       concluyes que el vector search sobra. La columna que lo desmiente es
       recall@10, y también es la que hace posible el paso de mañana.
    pasos:
      - titulo: "La firma común, otra vez"
        minutos: 5
        objetivo: >-
          Archivo nuevo, `retrieval.py`. El orden del archivo es el orden de la
          sesión.
        codigo:
          archivo: retrieval.py
          lineas: "1-30"
        porque: >-
          Cada estrategia recibe una query y devuelve una lista de ids
          ordenada. Esa firma común no es cosmética: es lo que permite pasarlas
          todas por el mismo `metricas.evaluar()` y comparar peras con peras.

      - titulo: "Vectorial: el de la sesión 04"
        minutos: 4
        objetivo: >-
          El buscador que ya conoces, con la firma nueva.
        codigo:
          archivo: retrieval.py
          lineas: "31-40"
          nuevo: true
        porque: >-
          Sin umbral. Aquí no filtramos: devolvemos el ranking completo para que
          las métricas puedan mirar hasta la posición 10. El umbral es cosa del
          RAG, no del buscador.

      - titulo: "BM25: un algoritmo de 1994 que sigue ganando"
        minutos: 8
        objetivo: >-
          Búsqueda léxica, exacta donde el embedding es difuso.
        define:
          - termino: 'BM25'
            es: >-
              Un algoritmo de búsqueda **léxica**: cuenta cuántas veces aparece
              cada palabra de la pregunta en cada documento, penalizando las
              palabras comunes y los documentos largos. No entiende de
              significado, y por eso acierta donde el embedding falla: para BM25
              `E-4012` es `E-4012`, no un código parecido.
          - termino: 'Búsqueda léxica y búsqueda densa'
            es: >-
              Dos familias. La léxica compara palabras (BM25); la densa compara
              significados a través de vectores (lo de la sesión 04). Sus fallos
              son distintos, y de ahí sale la idea de usar las dos.
        codigo:
          archivo: retrieval.py
          lineas: "41-57"
          nuevo: true
        python:
          - de: '[base.tokenizar(c["texto"]) for c in chunks]'
            es: >-
              Una comprensión que devuelve **listas dentro de una lista**: cada
              chunk se convierte en su lista de tokens. BM25 espera exactamente
              eso, un documento ya partido en palabras.
          - de: 'scores.argsort()[::-1]'
            es: >-
              Dos cosas juntas. `argsort()` no ordena los valores: devuelve
              **las posiciones** que los ordenarían de menor a mayor. Y `[::-1]`
              es una rebanada con paso `-1`, o sea "la misma lista al revés".
              Juntos dan las posiciones de mayor a menor, que es el ranking que
              queremos.
        porque: >-
          BM25 cuenta palabras: cuántas veces aparece cada término de la query en
          cada documento, penalizando los términos comunes y los documentos
          largos. No entiende nada de significado, y precisamente por eso acierta
          donde el embedding falla: `E-4012` es `E-4012`, no "un código de error
          parecido".

          Aquí es donde el `tokenizar()` del día 1 se cobra su sueldo.

      - titulo: "RRF: fusionar sin poder comparar"
        minutos: 9
        objetivo: >-
          Reciprocal Rank Fusion, que resuelve un problema que parece imposible.
        define:
          - termino: 'RRF'
            es: >-
              *Reciprocal Rank Fusion*. Una forma de mezclar dos rankings **sin
              comparar sus puntuaciones**: ignora los números y suma puntos por
              posición. Existe porque un coseno de 0.62 y un BM25 de 14.2 no son
              comparables, y normalizarlos es un problema en sí mismo.
          - termino: 'Búsqueda híbrida'
            es: >-
              Correr la búsqueda léxica y la densa por separado sobre todo el
              corpus, y fusionar los dos rankings. No es un buscador nuevo: son
              los dos que ya tienes, mezclados.
        codigo:
          archivo: retrieval.py
          lineas: "58-84"
          nuevo: true
        python:
          - de: 'scores.get(doc_id, 0)'
            es: >-
              Lee del diccionario y, si la clave no existe, devuelve el valor
              por defecto en vez de reventar. Es el patrón estándar para
              acumular: la primera vez devuelve 0, y a partir de ahí el
              acumulado.
          - de: 'for rank, doc_id in enumerate(ranking)'
            es: >-
              Desempaquetado directo en el bucle: `enumerate` entrega pares y
              las dos variables los recogen. Aquí `rank` es la posición, que es
              justo lo que RRF necesita.
          - de: 'sorted(scores, key=scores.get, reverse=True)'
            es: >-
              Ordenar un diccionario recorre sus **claves**. `key=` recibe una
              función que dice por qué valor ordenar cada clave, y aquí le
              pasamos `scores.get` sin paréntesis: **la función en sí**, no su
              resultado. `reverse=True` la pone de mayor a menor.
        porque: >-
          El problema: un coseno de 0.62 y un BM25 de 14.2 **no son
          comparables**. Están en escalas distintas, con distribuciones
          distintas, y normalizarlos es un pozo sin fondo.

          La solución de RRF es elegante por lo que tira a la basura: ignora las
          puntuaciones y usa solo las **posiciones**. Cada ranking aporta
          `1/(k + posición)` y se suman. El `k=60` amortigua el peso de los
          primeros puestos, de modo que un documento que sale segundo en ambos
          rankings puede ganarle a uno que sale primero en uno solo.

          Ese `k` es una perilla, y el día 3 vas a ver que tiene consecuencias.

      - titulo: "Reranking: caro, preciso, al final"
        minutos: 9
        objetivo: >-
          Releer query y documento juntos para producir una relevancia real.
        define:
          - termino: 'Reranking'
            es: >-
              Reordenar por relevancia real los pocos candidatos que ya
              recuperaste. No busca: solo cambia el orden de lo que le das.
          - termino: 'Cross-encoder'
            es: >-
              El modelo que hace ese trabajo. La diferencia con un embedding es
              de fondo: el embedding convierte pregunta y documento en vectores
              **por separado** y luego los compara; el cross-encoder los lee
              **juntos**, en la misma pasada. Mucho más preciso y mucho más
              caro, y por eso va al final y sobre pocos candidatos.
        codigo:
          archivo: retrieval.py
          lineas: "85-122"
          nuevo: true
        python:
          - de: 're.findall(r"\d+", texto)'
            es: >-
              `\d` es "cualquier dígito" y `+` es "uno o más". Sobre `"3,1,7,2"`
              devuelve `["3","1","7","2"]`. Ojo: son textos, no números; por eso
              el `int(n)` de después.
          - de: '[int(n) - 1 for n in …]'
            es: >-
              El `- 1` traduce de la numeración humana (que empieza en 1, la que
              ve el modelo) a la de Python (que empieza en 0). Ese desajuste es
              una fuente clásica de errores de un elemento.
          - de: 'if 0 <= i < len(candidatos_ids)'
            es: >-
              Una **comparación encadenada**, que en Python se escribe tal cual
              se lee en matemáticas. Equivale a `0 <= i and i < len(...)`. Está
              aquí porque el modelo puede inventarse un número fuera de rango.
          - de: '(reordenados + faltantes)[:top]'
            es: >-
              Sumar listas las **concatena** (no suma sus elementos), y la
              rebanada corta el resultado. En una línea: pega los que faltaban
              al final y quédate con los `top` primeros.
        porque: >-
          La diferencia técnica importa: el vector search convierte query y
          documento en embeddings **por separado** y compara los vectores. El
          reranker los lee **juntos**, en la misma pasada, y produce un score de
          relevancia de verdad. Mucho más preciso y mucho más caro.

          De ahí su lugar en el pipeline: al final, sobre los pocos candidatos
          que ya recuperaste barato. Aquí ese papel lo hace Claude en vez de un
          cross-encoder dedicado, para no bajarte un modelo de 2 GB; el lugar en
          el pipeline es el mismo.

      - titulo: "El buscador que sale de la sesión"
        minutos: 5
        objetivo: >-
          Empaquetar todo en algo que los scripts puedan usar.
        codigo:
          archivo: retrieval.py
          lineas: "123-140"
          nuevo: true
        python:
          - de: '{"nombre": lambda q: …}'
            es: >-
              Un diccionario cuyos valores son **funciones**. Permite elegir la
              variante por su nombre y llamarla después. Es lo que hace que
              añadir una quinta estrategia sea una línea más.
          - de: 'lambda q: buscar_vectores(collection, q)'
            es: >-
              La lambda **captura** las variables de alrededor: aunque
              `collection` no sea un parámetro, queda dentro y disponible cuando
              se llame más tarde. A eso se le llama *closure*, y es lo que deja
              todas las variantes con la misma firma de un solo argumento.
        porque: >-
          Devolver las variantes ya construidas evita que cada script repita el
          montaje, y garantiza que todos midan exactamente lo mismo. Si el
          montaje viviera en cada script, en dos semanas divergirían.

      - titulo: "La regla: no asumir que mejora"
        minutos: 8
        objetivo: >-
          Archivo nuevo, `02_hibrido_bm25_rrf.py`.
        codigo:
          archivo: 02_hibrido_bm25_rrf.py
          lineas: "1-32"
        porque: >-
          El script mide también "solo BM25", y esa fila está ahí a propósito.
          Es la fila incómoda: BM25 gana en varias queries, y si te quedaras con
          ella concluirías que el vector search sobra.

      - titulo: "Las tres variantes, lado a lado"
        minutos: 22
        objetivo: >-
          Medir, comparar y volver a diagnosticar.
        codigo:
          archivo: 02_hibrido_bm25_rrf.py
          lineas: "33-117"
          nuevo: true
        corre: |
          python 02_hibrido_bm25_rrf.py
        salida:
          archivo: 02_hibrido_bm25_rrf.txt
          lineas: "1-27"
        porque: >-
          Ganamos: recall@1 sube de **0.60 a 0.73** y el MRR de 0.71 a 0.82. El
          diagnóstico acertó y la palanca funcionó.

          Ahora la trampa. **"Solo BM25" empata al híbrido en recall@1 y le gana
          en recall@5.** La columna que lo desmiente es recall@10: BM25 pierde
          por completo *"¿cómo firmo mis webhooks?"* porque el documento dice
          "firma" y la query dice "firmo", y para BM25 son dos tokens distintos.
          Lo que no está entre los candidatos ya no lo rescata nadie.

          El híbrido es la única variante con **recall@10 = 1.00**. Ese es su
          valor real, y es una decisión de ingeniería más que de métrica:
          prefiero la variante que nunca pierde la evidencia, aunque hoy empate
          en recall@1, porque es la única sobre la que un paso de reordenamiento
          puede llegar a 1.00.

          Y una honestidad más, que el script no se calla: el híbrido dejó 2
          queries fuera del top-4, una más que BM25 solo. El `k=60` de RRF
          amortigua mucho un primer puesto fuerte de un solo ranker. Esa perilla
          se puede mover, y entonces se vuelve a medir.

  # =========================================================================
  - etiqueta: "Día 4"
    vienes_de: >-
       Ayer el híbrido dejó el chunk correcto siempre entre los candidatos:
       recall@10 = 1.00.
    titulo: "El reranker, ahora que los datos lo justifican"
    minutos: 30
    meta: >-
      Con el chunk correcto siempre entre los candidatos, lo único que queda es
      el orden. Esa es la condición exacta que el deck pone para el reranker, y
      recién ahora se cumple.
    archivo_completo:
      - 03_reranking.py
    checkpoint: >-
      Tienes las cuatro variantes con su latencia al lado, y recall@1 = 1.00.
      Puedes explicar por qué ese 1.00 se ve mejor de lo que es.
    video:
      id: ZFbaA9eM0uo
      porque: >-
        Reranking hands-on con cross-encoders de verdad, no con un modelo
        generalista como el nuestro. Es el paso natural cuando el reranker
        deje de ser una demo.
    te_deja: >-
       Llegaste a 1.00, y al lado tienes 1.63 segundos por query. Las dos cosas
       son el resultado. A partir de aquí ya no hay diagnóstico que arreglar en
       este corpus, así que el día 5 cambia de pregunta: ¿qué haces cuando el
       síntoma es otro?
    pasos:
      - titulo: "Por qué hoy y no en el día 3"
        minutos: 8
        objetivo: >-
          Archivo nuevo, `03_reranking.py`.
        codigo:
          archivo: 03_reranking.py
          lineas: "1-36"
        porque: >-
          El docstring dice las dos direcciones de la misma regla. Si el chunk
          correcto ya está entre los candidatos pero mal ordenado, el reranker es
          la herramienta. Si **no** está entre los candidatos, reordenarlos no lo
          va a inventar: un reranker sobre un mal recall es dinero y latencia
          tirados.

          Por eso el orden del taller es recuperación primero, orden después. No
          es pedagogía: es que al revés no funciona.

      - titulo: "Medir con el reloj al lado"
        minutos: 22
        objetivo: >-
          Las cuatro variantes, su latencia, y qué queries rescató el reranker.
        codigo:
          archivo: 03_reranking.py
          lineas: "37-103"
          nuevo: true
        corre: |
          python 03_reranking.py
        salida:
          archivo: 03_reranking.txt
          lineas: "1-26"
        porque: >-
          **recall@1 = 1.00, MRR = 1.00.** Y al lado, en la misma tabla: **1.63
          segundos por query** contra 0.08 del híbrido. Veinte veces más lento.
          Que el costo viaje junto al beneficio no es un detalle de formato: es
          lo que convierte el número en una decisión de producto.

          Mira `¿cómo firmo mis webhooks?`, que resume el pipeline entero: BM25
          solo la perdía, el híbrido la trajo de octava, el reranker la puso de
          primera. **Ninguno de los dos pasos habría bastado solo.**

          Y la lectura que impide engañarse: en un corpus de 23 chunks, 10
          candidatos son casi medio corpus, así que reordenar es un problema
          fácil y el 1.00 se ve espectacular. En un corpus real de cientos de
          miles, el reranker sigue viendo 10 o 50 candidatos: por eso **el recall
          del paso anterior es el que manda**.

  # =========================================================================
  - etiqueta: "Día 5"
    vienes_de: >-
       Ayer cerraste el caso de este corpus: recall@1 de 1.00, y el costo medido
       al lado.
    titulo: "Mapa de palancas: un menú por síntoma, no una lista de pasos"
    minutos: 45
    meta: >-
      Las otras cuatro técnicas del deck, cada una con su síntoma. Ninguna se
      activa "porque sí". Es el día más largo del taller y el más fácil de
      hojear: cada palanca es independiente.
    archivo_completo:
      - 04_mapa_de_palancas.py
    checkpoint: >-
      Puedes decir, para cada una de las cuatro técnicas, qué síntoma del golden
      set la justificaría.
    video:
      id: tmiBae2goJM
      porque: >-
        El contextual retrieval de la palanca C, con las cifras de Anthropic
        (49% y 67% menos fallos). Buen ejemplo de una mejora publicada con su
        medición al lado.
    te_deja: >-
       Ahora tienes el mapa completo: cuatro palancas más, cada una con el
       síntoma que la justifica. Ninguna se activa porque sí. Mañana entregas
       todo esto a la sesión 06, y ahí el modelo deja de ejecutar tu pipeline y
       empieza a decidir.
    pasos:
      - titulo: "La tabla síntoma a palanca"
        minutos: 7
        objetivo: >-
          Archivo nuevo, `04_mapa_de_palancas.py`. El docstring es un mapa.
        codigo:
          archivo: 04_mapa_de_palancas.py
          lineas: "1-46"
        porque: >-
          Estas cuatro técnicas **no** son "los siguientes pasos" después del
          reranking. Son respuestas a síntomas específicos, y si tu golden set no
          muestra ese síntoma, aplicarlas es complejidad sin retorno.

          El método no cambia nunca: identificas el síntoma, activas la palanca,
          corres el golden set, y el número decide.

      - titulo: "A · Query rewriting"
        minutos: 8
        objetivo: >-
          Cuando la pregunta del usuario no habla como el documento.
        codigo:
          archivo: 04_mapa_de_palancas.py
          lineas: "47-94"
          nuevo: true
        porque: >-
          El síntoma: el usuario usa siglas ambiguas o palabras que no están en
          tus documentos. La palanca reescribe la query antes de buscar, con el
          vocabulario que espera encontrar.

          Es la misma idea de la expansión de consulta que hiciste en la v0.4 del
          taller 04, ahora con su nombre técnico y su sitio en el mapa.

      - titulo: "B · Metadata filtering y self-query"
        minutos: 12
        objetivo: >-
          Sacar del juego lo que nunca debió competir, y dejar que el modelo
          escriba el filtro.
        codigo:
          archivo: 04_mapa_de_palancas.py
          lineas: "95-178"
          nuevo: true
        porque: >-
          Aquí entra la metadata que declaraste el día 1 y no habías usado. El
          síntoma es concreto: la query pregunta por la versión de TLS
          **actual**, y el changelog de 2025 compite con el de 2026. Ningún
          reranker arregla eso; filtrar por año, sí.

          Y el `self_query` es la puerta de entrada a la sesión 06: el modelo lee
          la pregunta en texto libre y **escribe el filtro**. Ya no es tu código
          decidiendo qué filtrar, es el modelo.

      - titulo: "C · Contextual retrieval"
        minutos: 9
        objetivo: >-
          Situar el chunk antes de indexarlo.
        codigo:
          archivo: 04_mapa_de_palancas.py
          lineas: "179-242"
          nuevo: true
        porque: >-
          El síntoma: el chunk aislado no se entiende sin su documento. *"La tasa
          subió al 3%"* es inútil si el chunk no dice de qué tasa habla.

          La palanca es de Anthropic: antes de indexar, el modelo escribe una
          frase que sitúa el chunk dentro de su documento, y se indexa el texto
          enriquecido. Cuesta una llamada por chunk **en la ingesta**, que se
          paga una vez, no en cada query.

      - titulo: "D · Parent-document"
        minutos: 5
        objetivo: >-
          Buscar con el chunk chico, entregar el grande.
        codigo:
          archivo: 04_mapa_de_palancas.py
          lineas: "243-273"
          nuevo: true
        porque: >-
          El síntoma más sutil de los cuatro: encuentras bien pero respondes
          corto. Los chunks chicos son precisos para buscar y pobres para
          responder.

          La palanca separa las dos cosas: indexas el chico, y cuando gana,
          entregas el padre. Es la única de las cuatro que no toca la búsqueda en
          absoluto, solo lo que se entrega después.

      - titulo: "Correr las cuatro"
        minutos: 4
        objetivo: >-
          Las cuatro demos, una detrás de otra.
        codigo:
          archivo: 04_mapa_de_palancas.py
          lineas: "274-297"
          nuevo: true
        corre: |
          python 04_mapa_de_palancas.py
          python 04_mapa_de_palancas.py --contextual   # + 23 llamadas
        salida:
          archivo: 04_mapa_de_palancas.txt
          lineas: "1-24"
        porque: >-
          Cada demo es deliberadamente corta: muestra el síntoma y la mecánica,
          no una evaluación completa. Esa la haces tú, en tu corpus, con tu
          golden set, y con la misma disciplina de los días 5 al 8.
        nota_coach: >-
          Este día se puede recorrer salteado si el tiempo aprieta: las cuatro
          palancas son independientes. Lo que no se puede saltar es la idea de
          que cada una necesita su síntoma.

  # =========================================================================
  - etiqueta: "Día 6"
    vienes_de: >-
       Ayer recorriste las cuatro palancas restantes y su síntoma
       correspondiente.
