    te_deja: >-
       Este es el final del camino de la sesión 05 y el principio del de la 06.
       Te llevas un retrieval que sabes medir, que es exactamente lo que hace
       falta antes de dejar que un agente lo use por su cuenta.
    pasos:
      - titulo: "Dónde encaja esta sesión"
        minutos: 6
        objetivo: >-
