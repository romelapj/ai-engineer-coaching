          Híbrido más reranking, con la firma que `rag.py` espera.
        codigo:
          archivo: 05_puente_a_agentes.py
          lineas: "42-73"
          nuevo: true
        porque: >-
          Fíjate en lo que **no** cambia: la firma. Todo el trabajo de los nueve
          días de trabajo entran al RAG por el mismo hueco que dejamos el día 1. Esa es la
          recompensa de haber parametrizado `responder()`.

      - titulo: "La misma pregunta, otra respuesta"
